<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deposit Dispute Simulator — Training Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ─── DESIGN TOKENS — Dwelly Brand Palette ─────────────────────────── */
    :root {
      /* Primary dark — Dwelly CTA / topbar navy */
      --navy:        #1A2E45;
      --navy-dark:   #111F30;
      --navy-light:  #253F5C;

      /* Teal — Dwelly brand accent */
      --green:       #28A78E;
      --green-light: #35C4A8;
      --green-pale:  #E0F7F2;

      /* Semantic colours — unchanged */
      --amber:       #B45309;
      --amber-pale:  #FEF3C7;
      --red:         #991B1B;
      --red-pale:    #FEE2E2;

      /* Info tint — shifted to mint-teal */
      --blue-pale:   #E6F7F4;

      --white:       #FFFFFF;

      /* Page background — Dwelly light mint */
      --bg:          #EDF8F5;
      --surface:     #FFFFFF;

      /* Borders — slightly warmer to complement the teal */
      --border:      #D4E8E4;
      --border-dark: #B8D5CF;

      /* Typography — unchanged */
      --text-primary:   #1A1D23;
      --text-secondary: #4F6460;
      --text-muted:     #7A9490;

      --shadow-sm:   0 1px 3px rgba(26,46,69,0.08), 0 1px 2px rgba(26,46,69,0.04);
      --shadow-md:   0 4px 12px rgba(26,46,69,0.08), 0 2px 4px rgba(26,46,69,0.04);
      --shadow-lg:   0 8px 24px rgba(26,46,69,0.10), 0 4px 8px rgba(26,46,69,0.05);
      --radius-sm:   6px;
      --radius-md:   10px;
      --radius-lg:   14px;
      --transition:  all 0.18s ease;
    }

    /* ─── RESET & BASE ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }
    a { color: var(--navy); text-decoration: none; }
    button { cursor: pointer; font-family: inherit; }
    input, textarea, select { font-family: inherit; }
    ul { list-style: none; }

    /* ─── TYPOGRAPHY ─────────────────────────────────────────────────────── */
    .t-display  { font-size: 2rem;   font-weight: 700; line-height: 1.25; letter-spacing: -0.02em; }
    .t-h1       { font-size: 1.5rem; font-weight: 700; line-height: 1.3;  letter-spacing: -0.01em; }
    .t-h2       { font-size: 1.25rem;font-weight: 600; line-height: 1.35; }
    .t-h3       { font-size: 1.05rem;font-weight: 600; line-height: 1.4;  }
    .t-body     { font-size: 0.9375rem; line-height: 1.65; }
    .t-small    { font-size: 0.8125rem; line-height: 1.5; }
    .t-label    { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    .t-mono     { font-family: 'SF Mono', 'Consolas', monospace; font-size: 0.875rem; }
    .t-muted    { color: var(--text-secondary); }
    .t-strong   { font-weight: 600; }

    /* ─── LAYOUT ─────────────────────────────────────────────────────────── */
    .app-shell { display: flex; flex-direction: column; min-height: 100vh; }

    .topbar {
      background: var(--navy);
      color: white;
      padding: 0 2rem;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      font-weight: 600;
      font-size: 0.9375rem;
      color: white;
    }
    .topbar-brand svg { opacity: 0.9; }
    .topbar-badge {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.85);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 2px 8px;
      border-radius: 20px;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.8125rem;
      color: rgba(255,255,255,0.7);
    }

    .disclaimer-bar {
      background: var(--amber-pale);
      border-bottom: 1px solid #FCD34D;
      padding: 8px 2rem;
      font-size: 0.8125rem;
      color: var(--amber);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .disclaimer-bar svg { flex-shrink: 0; }

    .main-content {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 2rem;
    }

    /* ─── PROGRESS WIZARD ────────────────────────────────────────────────── */
    .wizard-nav {
      display: flex;
      align-items: center;
      margin-bottom: 2.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
    }
    .wizard-step {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .wizard-step-inner {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .wizard-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      flex-shrink: 0;
      transition: var(--transition);
    }
    .wizard-dot.done     { background: var(--green); color: white; }
    .wizard-dot.active   { background: var(--navy); color: white; box-shadow: 0 0 0 3px rgba(27,58,92,0.18); }
    .wizard-dot.pending  { background: var(--bg); color: var(--text-muted); border: 2px solid var(--border-dark); }
    .wizard-label {
      font-size: 0.8125rem;
      font-weight: 500;
      white-space: nowrap;
    }
    .wizard-label.active  { color: var(--navy); font-weight: 600; }
    .wizard-label.done    { color: var(--green); }
    .wizard-label.pending { color: var(--text-muted); }
    .wizard-connector {
      width: 32px;
      height: 2px;
      background: var(--border);
      margin: 0 0.5rem;
      flex-shrink: 0;
    }
    .wizard-connector.done { background: var(--green); }

    /* ─── PAGE HEADER ────────────────────────────────────────────────────── */
    .page-header {
      margin-bottom: 2rem;
    }
    .page-header .eyebrow {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 0.375rem;
    }
    .page-header h1 {
      font-size: 1.625rem;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    .page-header p {
      color: var(--text-secondary);
      font-size: 0.9375rem;
      max-width: 620px;
    }

    /* ─── CARDS ──────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .card-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .card-body { padding: 1.5rem; }
    .card-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      background: var(--bg);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    /* ─── SCENARIO SELECTION GRID ────────────────────────────────────────── */
    .scenario-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 1.25rem;
    }
    .scenario-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.375rem 1.5rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
      box-shadow: var(--shadow-sm);
      position: relative;
    }
    .scenario-card:hover {
      border-color: var(--navy-light);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .scenario-card:active { transform: translateY(0); }
    .scenario-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .scenario-number {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      background: var(--navy);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.875rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .scenario-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--navy);
      line-height: 1.35;
      flex: 1;
    }
    .difficulty-badge {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 20px;
      flex-shrink: 0;
    }
    .difficulty-badge.straightforward { background: var(--green-pale); color: var(--green); }
    .difficulty-badge.moderate        { background: var(--amber-pale); color: var(--amber); }
    .difficulty-badge.complex         { background: var(--red-pale);   color: var(--red); }

    .scenario-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem 1rem;
    }
    .meta-item { }
    .meta-label { font-size: 0.6875rem; font-weight: 600; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; }
    .meta-value { font-size: 0.875rem; font-weight: 500; color: var(--text-primary); margin-top: 2px; }

    .scenario-address {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }
    .scenario-cta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--navy);
    }

    /* ─── BUTTONS ────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.625rem 1.25rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      border: 1.5px solid transparent;
      transition: var(--transition);
      line-height: 1;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--navy);
      color: white;
      border-color: var(--navy);
    }
    .btn-primary:hover { background: var(--navy-dark); border-color: var(--navy-dark); }
    .btn-secondary {
      background: white;
      color: var(--navy);
      border-color: var(--border-dark);
    }
    .btn-secondary:hover { background: var(--bg); border-color: var(--navy-light); }
    .btn-success {
      background: var(--green);
      color: white;
      border-color: var(--green);
    }
    .btn-success:hover { background: var(--green-light); border-color: var(--green-light); }
    .btn-danger {
      background: var(--red-pale);
      color: var(--red);
      border-color: #FCA5A5;
    }
    .btn-danger:hover { background: #FEE2E2; }
    .btn-sm { padding: 0.4rem 0.875rem; font-size: 0.8125rem; }
    .btn-lg { padding: 0.875rem 1.75rem; font-size: 1rem; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    /* ─── FORM ELEMENTS ──────────────────────────────────────────────────── */
    .form-group { margin-bottom: 1.25rem; }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.375rem;
    }
    .form-label .required { color: var(--red); margin-left: 2px; }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1.5px solid var(--border-dark);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      color: var(--text-primary);
      background: var(--surface);
      transition: var(--transition);
      line-height: 1.5;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(27,58,92,0.12);
    }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }
    .form-error {
      font-size: 0.8rem;
      color: var(--red);
      margin-top: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .char-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: right;
      margin-top: 0.25rem;
    }
    .char-count.warn { color: var(--amber); }

    /* ─── INFO / ALERT BOXES ─────────────────────────────────────────────── */
    .alert {
      padding: 0.875rem 1.125rem;
      border-radius: var(--radius-md);
      border: 1.5px solid;
      font-size: 0.875rem;
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      margin-bottom: 1rem;
    }
    .alert svg { flex-shrink: 0; margin-top: 1px; }
    .alert-info    { background: var(--blue-pale);  border-color: #BFDBFE; color: #1E40AF; }
    .alert-warning { background: var(--amber-pale); border-color: #FCD34D; color: var(--amber); }
    .alert-success { background: var(--green-pale); border-color: #86EFAC; color: var(--green); }
    .alert-danger  { background: var(--red-pale);   border-color: #FCA5A5; color: var(--red); }

    /* ─── TENANCY SUMMARY TABLE ──────────────────────────────────────────── */
    .tenancy-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .tenancy-table td { padding: 0.625rem 0.875rem; border-bottom: 1px solid var(--border); }
    .tenancy-table td:first-child { font-weight: 600; color: var(--text-secondary); width: 200px; background: var(--bg); border-right: 1px solid var(--border); }
    .tenancy-table tr:last-child td { border-bottom: none; }

    /* ─── DEDUCTIONS TABLE ───────────────────────────────────────────────── */
    .deduction-row {
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 1rem;
      background: var(--surface);
      overflow: hidden;
    }
    .deduction-row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem 1rem;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .deduction-row-body { padding: 1.25rem; }
    .deduction-row-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .deposit-summary {
      background: var(--navy);
      color: white;
      border-radius: var(--radius-md);
      padding: 1.25rem 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .deposit-summary-item { text-align: center; }
    .deposit-summary-item .label { font-size: 0.75rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.25rem; }
    .deposit-summary-item .value { font-size: 1.375rem; font-weight: 700; }
    .deposit-summary-item .value.over { color: #FCA5A5; }

    /* ─── EVIDENCE POOL ──────────────────────────────────────────────────── */
    .evidence-pool { display: flex; flex-direction: column; gap: 0.625rem; }
    .evidence-item {
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.875rem 1rem;
      background: var(--surface);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      gap: 0.875rem;
      align-items: flex-start;
    }
    .evidence-item:hover { border-color: var(--navy-light); background: var(--blue-pale); }
    .evidence-item.selected {
      border-color: var(--navy);
      background: var(--blue-pale);
      box-shadow: 0 0 0 2px rgba(27,58,92,0.10);
    }
    .evidence-item.flawed.selected { border-color: var(--amber); background: var(--amber-pale); }
    .evidence-item.irrelevant { opacity: 0.7; }
    .evidence-checkbox {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 2px solid var(--border-dark);
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      background: white;
    }
    .evidence-item.selected .evidence-checkbox { background: var(--navy); border-color: var(--navy); }
    .evidence-item.flawed.selected .evidence-checkbox { background: var(--amber); border-color: var(--amber); }
    .evidence-content { flex: 1; }
    .evidence-title { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.25rem; }
    .evidence-desc  { font-size: 0.825rem; color: var(--text-secondary); line-height: 1.5; }
    .evidence-tags  { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.5rem; }
    .evidence-tag {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 20px;
    }
    .tag-strong     { background: var(--green-pale); color: var(--green); }
    .tag-moderate   { background: var(--blue-pale);  color: #1E40AF; }
    .tag-weak       { background: var(--amber-pale); color: var(--amber); }
    .tag-flawed     { background: var(--amber-pale); color: var(--amber); border: 1px solid #FCD34D; }
    .tag-irrelevant { background: var(--bg);         color: var(--text-muted); border: 1px solid var(--border-dark); }
    .tag-required   { background: var(--red-pale);   color: var(--red); }

    .covering-note-area {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    /* ─── BUNDLE REVIEW ──────────────────────────────────────────────────── */
    .review-section { margin-bottom: 1.5rem; }
    .review-section-title {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .warning-flag {
      display: flex;
      align-items: flex-start;
      gap: 0.625rem;
      padding: 0.75rem 1rem;
      background: var(--amber-pale);
      border: 1px solid #FCD34D;
      border-radius: var(--radius-sm);
      margin-bottom: 0.625rem;
      font-size: 0.85rem;
      color: #92400E;
    }
    .warning-flag svg { flex-shrink: 0; margin-top: 1px; }
    .review-deduction-item {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 0.875rem;
      overflow: hidden;
    }
    .review-deduction-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .review-evidence-list { padding: 0.875rem 1rem; }
    .review-evidence-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0;
      font-size: 0.85rem;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
    }
    .review-evidence-item:last-child { border-bottom: none; }

    /* ─── ADJUDICATOR REPORT ─────────────────────────────────────────────── */
    .report-shell {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      max-width: 860px;
      margin: 0 auto;
    }
    .report-header {
      background: var(--navy);
      color: white;
      padding: 2rem 2.5rem;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    .report-header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    .report-scheme-logo {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.7;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 4px 10px;
      border-radius: 4px;
    }
    .report-case-ref {
      font-size: 0.8125rem;
      opacity: 0.7;
      font-family: 'SF Mono', monospace;
    }
    .report-title {
      font-size: 1.375rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .report-subtitle { font-size: 0.9rem; opacity: 0.8; }
    .report-parties {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.15);
    }
    .report-party-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.6; margin-bottom: 0.25rem; }

    .report-party-sub   { font-size: 0.8125rem; opacity: 0.75; }

      font-weight: 700;
      letter-spacing: 0.1em;

      line-height: 1.75;

    }

      align-items: center;

      display: inline-flex;
      align-items: center;

    .report-total-value.green { color: #86EFAC; }

    /* ─── DEBRIEF ────────────────────────────────────────────────────────── */
    .debrief-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .debrief-card {
      border-radius: var(--radius-md);
      padding: 1.25rem;
      border: 1.5px solid;

      font-weight: 700;

      text-transform: uppercase;

    .tenant-dispute-box {
      border: 1.5px solid #FCA5A5;

    .divider { height: 1px; background: var(--border); margin: 1.5rem 0; }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;

    .badge-navy   { background: rgba(27,58,92,0.1); color: var(--navy); }
    .badge-green  { background: var(--green-pale); color: var(--green); }
    .badge-amber  { background: var(--amber-pale); color: var(--amber); }
    .badge-red    { background: var(--red-pale); color: var(--red); }
    .flex-between { display: flex; align-items: center; justify-content: space-between; }
    .flex-center  { display: flex; align-items: center; }
    .gap-sm { gap: 0.5rem; }

    .mb-1 { margin-bottom: 0.5rem; }
    .mb-2 { margin-bottom: 1rem; }
    .mb-3 { margin-bottom: 1.5rem; }
    .hidden { display: none !important; }

    /* ─── RESPONSIVE (desktop-first, tablet minimum) ─────────────────────── */
    @media (max-width: 768px) {
      .main-content { padding: 1.5rem 1rem; }
      .scenario-grid { grid-template-columns: 1fr; }
      .deduction-row-grid { grid-template-columns: 1fr; }

    }

    /* ─── PRINT ───────────────────────────────────────────────────────────── */
    @media print {
      .topbar, .disclaimer-bar, .wizard-nav, .nav-footer, .btn { display: none !important; }
      .report-shell { box-shadow: none; border: 1px solid #ccc; }
    }
  </style>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════════════════
   GOVERNANCE — input sanitisation, rate limiting, usage caps
═══════════════════════════════════════════════════════════════════════════ */
const GOVERNANCE = {
  RATE_LIMIT: { maxSubmissions: 10, windowMs: 60 * 60 * 1000 },
  CAPS: { maxDeductions: 10, maxEvidencePerDeduction: 8, maxJustificationLen: 500, maxCoveringNoteLen: 250, maxTextLen: 500, minTextLen: 20 },
  STORAGE_KEY: 'dds_submissions',
  LOG_KEY: 'dds_session_log',
  MAX_LOG: 20,

  sanitiseText(raw) {
    if (typeof raw !== 'string') return '';
    return raw
      .replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#x27;')
      .replace(/`/g, '&#x60;')
      .replace(/javascript:/gi, '')
      .replace(/on\w+=/gi, '')
      .trim();
  },

  validateText(text, label, minLen, maxLen) {
    const t = (text || '').trim();
    if (t.length < minLen) return `${label} must be at least ${minLen} characters.`;
    if (t.length > maxLen) return `${label} must not exceed ${maxLen} characters.`;
    return null;
  },

  validateAmount(val, depositTotal) {
    const n = parseFloat(val);
    if (isNaN(n) || n < 1)    return 'Amount must be at least £1.00.';
    if (n > 9999.99)           return 'Amount cannot exceed £9,999.99.';
    if (n > depositTotal)      return `Amount cannot exceed the deposit (£${depositTotal.toFixed(2)}).`;
    return null;
  },

  checkRateLimit() {
    const now = Date.now();
    let log = [];
    try { log = JSON.parse(localStorage.getItem(this.STORAGE_KEY) || '[]'); } catch(e) {}
    log = log.filter(ts => now - ts < this.RATE_LIMIT.windowMs);
    if (log.length >= this.RATE_LIMIT.maxSubmissions) {
      const earliest = Math.min(...log);
      const waitMin = Math.ceil((this.RATE_LIMIT.windowMs - (now - earliest)) / 60000);
      return { allowed: false, waitMin };
    }
    log.push(now);
    try { localStorage.setItem(this.STORAGE_KEY, JSON.stringify(log.slice(-50))); } catch(e) {}
    return { allowed: true };
  },

  logSession(scenarioId, depositAmount, outcomeTotal) {
    let log = [];
    try { log = JSON.parse(localStorage.getItem(this.LOG_KEY) || '[]'); } catch(e) {}
    log.push({ timestamp: new Date().toISOString(), scenarioId, depositAmount, outcomeTotal });
    if (log.length > this.MAX_LOG) log = log.slice(-this.MAX_LOG);
    try { localStorage.setItem(this.LOG_KEY, JSON.stringify(log)); } catch(e) {}
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   SCENARIO DATA
═══════════════════════════════════════════════════════════════════════════ */
const SCENARIOS = {

    tenantDispute: `I am writing to formally dispute the proposed deduction of £450 for professional cleaning. The property was returned in a clean and habitable condition. I carried out a thorough clean over two days prior to vacating and I am satisfied that the property met the standard it was in when I moved in.\n\nI note that the document referred to as a check-in inventory is in fact a basic checklist completed by the landlord himself — it is not a professional inventory produced by an independent clerk and it contains no photographic schedule. Without independent professional verification of the property's starting condition, I do not accept that any meaningful before-and-after comparison can be made. The checkout report was also prepared by the agent themselves and I was given no opportunity to attend or countersign it.\n\nI am happy for the adjudicator to consider the evidence and I am confident the claim cannot be substantiated to the required standard.`,

      { id:'e1_1', title:'Check-in Condition Checklist (Landlord-Prepared)', type:'baseline', weight:'moderate', role:'required', flaw:'no_photographs', desc:'Basic room-by-room checklist completed by the landlord at the start of the tenancy. Not produced by a professional inventory clerk or AIIC-registered company. Ticks broad condition categories (clean/dirty/damaged) per room with brief handwritten notes. Contains no photographic schedule.', flawNote:'This is a landlord-prepared checklist, not a professional inventory. It contains no photographs, no photographic schedule reference, and was not produced by an independent clerk. Without photographs, comparison of cleanliness relies entirely on the landlord\'s own subjective narrative notes, which carries reduced evidential weight.' },
      { id:'e1_2', title:'Professional Checkout Report', type:'comparative', weight:'strong', role:'required', flaw:null, desc:'Independent checkout report prepared by a professional inventory clerk. Documents the condition of each room on the day of vacation, notes heavy soiling in kitchen and bathroom, marks left on oven, grease on extractor fan, limescale in bathroom.' },
      { id:'e1_3', title:'Exit Photographs (Agent-taken, undated)', type:'comparative', weight:'weak', role:'supporting', flaw:'no_date_stamp', desc:'A set of photographs taken by the agent at checkout. Show soiling in kitchen and bathroom. The photographs carry no date stamp and were not shared with the tenant at the time of checkout.', flawNote:'Undated photographs carry reduced evidential weight. The absence of a date stamp means the adjudicator cannot confirm these were taken at the point of vacation.' },
      { id:'e1_4', title:'Professional Cleaning Invoice — £450', type:'financial', weight:'strong', role:'required', flaw:null, desc:'Invoice from CleanPro Services Ltd, dated 5 February 2024. VAT registered. Itemises deep clean of kitchen (oven, extractor, surfaces), bathroom descaling, and carpet spot cleaning. Total £450.00.' },
      { id:'e1_5', title:'Tenancy Agreement — Cleaning Clause (Clause 14)', type:'contractual', weight:'strong', role:'required', flaw:null, desc:'Extract from the signed tenancy agreement. Clause 14 states: "The Tenant shall return the property in the same state of cleanliness as at the commencement of the tenancy, as evidenced by the check-in inventory."' },
      { id:'e1_6', title:'Email to Tenant — Cleaning Concerns (3 Feb 2024)', type:'correspondence', weight:'moderate', role:'supporting', flaw:null, desc:'Email from the letting agent to Ms Hartley dated 3 February 2024. Itemises cleaning concerns observed at checkout and requests the tenant respond or arrange professional cleaning at their own cost within 5 days.' },
      { id:'e1_7', title:'Mid-Tenancy Inspection Report (March 2023)', type:'supporting', weight:'weak', role:'supporting', flaw:'no_photos_inspection', desc:'Periodic inspection report dated 14 March 2023. Notes general condition as satisfactory. Does not include photographs. No tenant signature recorded.', flawNote:'Mid-tenancy inspection reports without photographs and without tenant signature carry limited weight.' },
      { id:'e1_8', title:'Agent\'s Own Cleaning Cost Estimate', type:'financial', weight:'weak', role:'supporting', flaw:'self_prepared', desc:'A cost estimate prepared by the property manager estimating cleaning costs at £430. Not from a third party. No letterhead or company registration.', flawNote:'Self-prepared cost estimates carry very limited evidential weight. A professional invoice from a third party is required.' },
      { id:'e1_9', title:'Professional Carpet Clean Receipt — £120', type:'financial', weight:'strong', role:'supporting', flaw:null, desc:'Receipt from Fibrefresh Carpet Cleaning Ltd for specialist carpet cleaning in the main bedroom and living room. Dated 7 February 2024. VAT included.' },
      { id:'e1_10', title:'Oven Clean Quote — £85', type:'financial', weight:'moderate', role:'supporting', flaw:'single_quote', desc:'Quote from Clean King Ltd for specialist oven cleaning. Single quote only — no comparative quote obtained.', flawNote:'A single quote without a comparative may attract reduced weight as it cannot be verified against market rate.' },
      { id:'e1_11', title:'Email from Tenant — Pre-Vacation Notice', type:'correspondence', weight:'weak', role:'irrelevant', flaw:'irrelevant', desc:'Email from Ms Hartley dated 25 January 2024 giving notice of vacation date. Does not address cleaning obligations. Irrelevant to this claim.', flawNote:'This document does not support the cleaning claim and over-bundles the submission.' },

    ],

  2: {
    id: 2, title: 'Carpet Catastrophe', difficulty: 'moderate',
    disputeType: 'Damage — Carpet Staining', deposit: 1600,
    address: '7 Fenwick Gardens, Birmingham, B15 3JR',
    tenantName: 'Mr Emeka and Mrs Adaeze Okafor', schemeType: 'TDS Custodial',
    tenancyStart: '1 September 2020', tenancyEnd: '31 August 2022', tenancyMonths: 24,
    carpetAgeAtStart: 6, carpetLifecycle: 10,
    trap: 'betterment_carpet',
    tenantDispute: `We dispute the deduction of £680 for carpet replacement. While we acknowledge that some staining occurred in the living room during our tenancy, we strongly dispute both the extent of the claim and the amount sought.\n\nThe carpet was already well-worn when we moved in. The check-in inventory describes the carpet as showing signs of prior use and general wear. We occupied the property for only two years, during which time normal daily living would in any case have depreciated a carpet of this age further.\n\nWe accept that some staining occurred but contend that the full replacement cost cannot reasonably be attributed to us. The landlord is seeking to replace a carpet that was, by their own documentation, already six years old at the start of our tenancy. We ask the adjudicator to apply the relevant betterment principle.`,

      { id:'e2_2', title:'Check-out Inventory — Signed by Tenant', type:'comparative', weight:'strong', role:'required', flaw:null, desc:'Checkout inventory signed by the tenants. Notes significant staining in living room carpet covering approximately 40% of the carpet area. Tenant signature acknowledges the staining is noted.' },

  4: {

      { id:'e8_5', title:'Tenancy Agreement — Alterations Clause (Clause 12)', type:'contractual', weight:'strong', role:'required', flaw:null, desc:'Extract from the signed tenancy agreement. Clause 12 states: "The Tenant shall not paint, wallpaper, or otherwise alter the decoration of the Property without the prior written consent of the Landlord, and shall reinstate any such alteration to its original condition at the end of the tenancy." An express prohibition and reinstatement obligation.' },

      { id:'e8_8', title:'Professional Reinstatement Invoice — £520', type:'financial', weight:'strong', role:'required', flaw:null, desc:'Invoice from Fenland Decorators Ltd, VAT registered, dated 12 March 2024. Itemises stain-blocking primer and two coats to reinstate the altered wall to the original neutral finish. Total £520.00.' },
      { id:'e8_9', title:'Single Reinstatement Estimate — £560 (No Invoice)', type:'financial', weight:'weak', role:'supporting', flaw:'single_quote', desc:'A written estimate from an individual painter for the reinstatement works. A quotation only — no VAT number, and no evidence that work was carried out.', flawNote:'A quotation is not proof that a cost was incurred. Where an invoice for completed work is available it should be relied upon; a lone estimate leaves quantum unproven.' },
      { id:'e8_10', title:'Email to Tenant re Reinstatement (March 2024)', type:'correspondence', weight:'moderate', role:'supporting', flaw:null, desc:'Email from the agent to Mr Voss dated 4 March 2024 identifying the altered wall, referring to Clause 12, and proposing the reinstatement deduction with photographs attached.' },
      { id:'e8_11', title:'Colour Scheme Mood-board (Landlord\'s Preference)', type:'supporting', weight:'weak', role:'irrelevant', flaw:'irrelevant', desc:'A mood-board prepared by the landlord setting out a preferred colour scheme for future re-lets. Entirely irrelevant to whether an unauthorised alteration occurred.', flawNote:'The landlord\'s decorative preferences for future tenants are irrelevant. The claim is reinstatement to the original condition, not an upgrade.' },
      { id:'e8_12', title:'Paint Receipt Found in Property (Tenant\'s)', type:'supporting', weight:'weak', role:'irrelevant', flaw:'irrelevant', desc:'A retail receipt for dark navy paint left behind by the tenant. Included as a curiosity; adds nothing to the professionally-documented before-and-after evidence.', flawNote:'Incidental items like this over-bundle the submission. The check-in and check-out records already establish the alteration.' }
    ],
    keyLearning: 'To recover reinstatement costs for an alteration, three things must be proven: that the alteration was made during the tenancy (check-in vs check-out), that it was unauthorised (an express prohibition or consent clause — not a generic "good condition" clause), and that the cost is reasonable and supported by an invoice, not merely a quote.'
  },

  9: {
    id: 9, title: 'Double Trouble', difficulty: 'complex',
    disputeType: 'Specialist Treatment — "Other"', deposit: 1300,
    address: '27 Elmwood Terrace, Cardiff, CF11 9LB',
    tenantName: 'Ms Priya Nair', schemeType: 'TDS Custodial',
    tenancyStart: '1 May 2022', tenancyEnd: '30 April 2024', tenancyMonths: 24,

    tenantDispute: `I dispute the deduction of £275 described as an "anti-allergen and flea spray-down". I kept a cat during my tenancy, which was expressly permitted, and I returned the property clean.\n\nThe landlord has separately deducted £390 for a full professional clean of the whole property, including all carpets and soft furnishings. The "spray-down" now claimed covers exactly the same rooms and surfaces. I do not accept that I should pay twice for the treatment of the same areas.\n\nThere is nothing in my tenancy agreement requiring me to fund any specialist pet treatment, and there is no evidence that the property was ever infested or contaminated. The charge is supported only by a quotation. I ask the adjudicator to disallow it.`,

      { id:'e9_4', title:'Check-out Photographs — General Soiling', type:'comparative', weight:'moderate', role:'supporting', flaw:null, desc:'Dated checkout photographs showing general cleaning required in the kitchen and on the carpets. Show no evidence of infestation, droppings, or contamination.' },
      { id:'e9_5', title:'Anti-Allergen Spray-Down Quotation — £275', type:'financial', weight:'weak', role:'required', flaw:'single_quote', desc:'A quotation from a pet-treatment firm for an "anti-allergen and flea spray-down" of the carpets and soft furnishings. A quote only — no invoice, and no confirmation that the treatment was ever carried out.', flawNote:'This is a quotation, not an invoice. It does not establish that any cost was incurred, and the areas it covers overlap entirely with the professional clean already claimed.' },
      { id:'e9_6', title:'Second Pest-Treatment Quotation — £310', type:'financial', weight:'weak', role:'supporting', flaw:'single_quote', desc:'A second quotation from an alternative firm for a similar spray-down. Also a quote only, and likewise unsupported by any evidence of an actual infestation.', flawNote:'A second quotation for the same unproven work does not cure the underlying problems: no infestation evidence, no invoice, and overlap with the cleaning already claimed.' },
      { id:'e9_7', title:'Tenancy Agreement — Pet Clause (Clause 21)', type:'contractual', weight:'moderate', role:'required', flaw:'vague_clause', desc:'Clause 21: "The Tenant may keep one domestic cat and shall return the Property free from pet odour at the end of the tenancy." Permits the pet and requires the property to be returned free of odour. It does NOT require the tenant to pay for any specialist anti-allergen or flea treatment.', flawNote:'This clause permits a pet and requires the property to be returned free of odour — an obligation met by ordinary cleaning. It creates no contractual basis for a separate paid specialist treatment.' },
      { id:'e9_8', title:'Tenancy Agreement — Cleaning Clause (Clause 14)', type:'contractual', weight:'strong', role:'supporting', flaw:null, desc:'Clause 14 requires the property to be returned in the same standard of cleanliness as recorded at check-in. Supports the separate cleaning claim — but not a distinct specialist-treatment charge.' },
      { id:'e9_9', title:'Agent\'s Note — "Recommend Spray-Down"', type:'supporting', weight:'weak', role:'supporting', flaw:'self_prepared', desc:'A short internal note prepared by the property manager recommending a precautionary spray-down "as the tenant had a cat". Self-prepared; not based on any professional assessment or finding of infestation.', flawNote:'A self-prepared recommendation is not independent evidence that specialist treatment was necessary. A professional pest-control report making a finding would be required.' },

    keyLearning: 'A landlord cannot recover twice for the same remedial work. A specialist treatment that overlaps with a professional clean already claimed is double recovery. Each deduction also needs its own contractual basis and its own proven quantum — a quote is not an invoice, and an assertion is not evidence of infestation. Sometimes the right decision is not to make the claim at all.'
