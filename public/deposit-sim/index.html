/* ═══════════════════════════════════════════════════════════════════════════
   SCREEN 7 — DEBRIEF & LEARNING
═══════════════════════════════════════════════════════════════════════════ */
function renderScreen7() {
  const result = STATE.adjudicatorResult;
  const debrief = STATE.debriefData;
  if (!result || !debrief) { renderScreen1(); return; }
  const s = result.scenario;

  const scoreClass = debrief.score >= 75 ? 'high' : debrief.score >= 40 ? 'medium' : 'low';
  const scoreLabel = debrief.score >= 80 ? 'Excellent — strong submission' :
                     debrief.score >= 65 ? 'Good — most evidence was in place' :
                     debrief.score >= 40 ? 'Partial — key gaps weakened the case' :
                     debrief.score >= 15 ? 'Weak — significant evidential failures' :
                                           'Very weak — essential evidence missing';

  const wellDoneHtml = debrief.wellDone.length > 0
    ? `<ul class="debrief-list">${debrief.wellDone.map(w=>`<li><span>${UI.escHtml(w)}</span></li>`).join('')}</ul>`
    : `<p class="t-small t-muted" style="padding:0.5rem 0">No fully successful claim outcomes in this submission.</p>`;

  const weaknessHtml = debrief.weaknesses.length > 0
    ? `<ul class="debrief-list">${debrief.weaknesses.map(w=>`<li><span>${UI.escHtml(w)}</span></li>`).join('')}</ul>`
    : `<p class="t-small" style="color:var(--green);padding:0.5rem 0">No significant weaknesses identified — well done.</p>`;

  const idealHtml = debrief.idealBundle.length > 0
    ? `<ul class="debrief-list">${debrief.idealBundle.map(i=>`<li><span>${UI.escHtml(i)}</span></li>`).join('')}</ul>`
    : '';

  // Per-deduction score breakdown
  const claimBreakdownHtml = debrief.deductionResults.map((r, idx) => {
    const cat = r.category ? r.category.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()) : 'Uncategorised';
    const pct = r.claimed > 0 ? Math.round((r.awarded / r.claimed) * 100) : 0;
    const barColour = pct >= 80 ? 'var(--green)' : pct >= 40 ? 'var(--amber)' : 'var(--red)';
    const chip = UI.awardChip(r.outcomeType, r.awarded);
    return `<div style="margin-bottom:1.25rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;flex-wrap:wrap;gap:0.5rem">
        <div style="font-weight:600;font-size:0.9rem">${idx+1}. ${UI.escHtml(cat)} — ${UI.formatGBP(r.claimed)} claimed</div>
        ${chip}
      </div>
      <div style="background:var(--bg);border-radius:100px;height:8px;overflow:hidden;margin-bottom:0.375rem">
        <div style="height:100%;width:${pct}%;background:${barColour};border-radius:100px;transition:width 0.4s ease"></div>
      </div>
      <div style="font-size:0.8rem;color:var(--text-secondary)">${UI.formatGBP(r.awarded)} recovered (${pct}%)${r.legalPrinciple ? ` — ${r.legalPrinciple.replace(/_/g,' ')} applied` : ''}</div>
    </div>`;
  }).join('');

  // TDS guidance blocks per unique claim type
  const seenTypes = new Set();
  const guidanceHtml = debrief.deductionResults.map(r => {
    const key = (r.category||'').toLowerCase();
    if (seenTypes.has(key)) return '';
    seenTypes.add(key);
    const guidance = DEBRIEF.getClaimGuidance(r.category);
    const cat = r.category ? r.category.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()) : 'General';
    return `
    <div style="margin-bottom:1.5rem;padding:1.25rem;background:var(--bg);border-radius:8px;border:1px solid var(--border)">
      <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--navy);margin-bottom:0.375rem">Claim Type: ${UI.escHtml(cat)}</div>
      <div style="background:var(--blue-pale);border-left:3px solid var(--navy);border-radius:4px;padding:10px 14px;margin-bottom:0.875rem;font-size:0.875rem;line-height:1.7;color:#1E3A8A;font-style:italic">${UI.escHtml(guidance.tdsQuote)}</div>
      <div style="font-size:0.8rem;font-weight:700;color:var(--amber);margin-bottom:0.375rem">TDS STATISTICS</div>
      <p style="font-size:0.875rem;line-height:1.65;margin-bottom:0.875rem;color:var(--text-secondary)">${UI.escHtml(guidance.stat)}</p>
      <div style="font-size:0.8rem;font-weight:700;color:var(--green);margin-bottom:0.5rem">BEST PRACTICE TIPS</div>
      <ul style="padding-left:1.25rem;margin:0">${guidance.tips.map(t=>`<li style="font-size:0.875rem;line-height:1.65;margin-bottom:0.375rem;color:var(--text-primary)">${UI.escHtml(t)}</li>`).join('')}</ul>
    </div>`;
  }).join('');

  // Legal principles applied
  const principlesHtml = debrief.legalPrinciples.map(p => {
    const text = ADJUDICATOR.legalPrincipleText(p);
    if (!text) return '';
    const label = p.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    return `<div style="margin-bottom:1rem;padding:1rem 1.125rem;background:var(--bg);border-radius:8px;border:1px solid var(--border);border-left:4px solid #3B82F6">
      <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:#1D4ED8;margin-bottom:0.5rem">${UI.escHtml(label)}</div>
      <p style="font-size:0.875rem;line-height:1.75;margin:0;color:var(--text-primary)">${UI.escHtml(text)}</p>
    </div>`;
  }).join('');

  // Product lifespan table (shown if betterment was applied)
  const showLifespanTable = debrief.legalPrinciples.includes('betterment') || debrief.legalPrinciples.includes('decoration_lifecycle');
  const lifespanTableHtml = showLifespanTable ? `
    <div class="card mb-3">
      <div class="card-header"><span class="t-h3">TDS/NRLA Product Lifespan Reference</span><span class="badge badge-navy">Betterment Guide</span></div>
      <div class="card-body" style="padding:0">
        <table style="width:100%;border-collapse:collapse;font-size:0.875rem">
          <thead><tr style="background:var(--bg);border-bottom:2px solid var(--border)">
            <th style="padding:10px 14px;text-align:left;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-secondary)">Item</th>
            <th style="padding:10px 14px;text-align:center;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-secondary)">Low Quality</th>
            <th style="padding:10px 14px;text-align:center;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-secondary)">Medium Quality</th>
            <th style="padding:10px 14px;text-align:center;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-secondary)">High Quality</th>
          </tr></thead>
          <tbody>
            ${[
              ['Carpet','2–4 yrs','5–8 yrs','8–15 yrs'],
              ['Interior Decoration (Paint)','3–5 yrs','5–7 yrs','7+ yrs'],
              ['Curtains / Blinds','3–5 yrs','5–8 yrs','8+ yrs'],
              ['Sofa / Upholstered Furniture','5–7 yrs','7–10 yrs','10–15 yrs'],
              ['Mattress','5–7 yrs','7–10 yrs','10+ yrs'],
              ['Washing Machine','7–10 yrs','10–12 yrs','12–15 yrs'],
              ['Fridge / Freezer','8–10 yrs','10–12 yrs','12–15 yrs'],
              ['Dishwasher','7–10 yrs','10–12 yrs','12+ yrs'],
              ['Oven / Hob','8–10 yrs','10–12 yrs','12–15 yrs'],
            ].map((row, i) => `<tr style="${i%2===1?'background:#F9FAFB':''}">
              <td style="padding:9px 14px;font-weight:500">${row[0]}</td>
              <td style="padding:9px 14px;text-align:center;color:var(--text-secondary)">${row[1]}</td>
              <td style="padding:9px 14px;text-align:center;font-weight:600;color:var(--navy)">${row[2]}</td>
              <td style="padding:9px 14px;text-align:center;color:var(--text-secondary)">${row[3]}</td>
            </tr>`).join('')}
          </tbody>
        </table>
        <p style="font-size:0.75rem;color:var(--text-muted);padding:0.75rem 1rem 0.875rem;margin:0;border-top:1px solid var(--border)">Source: TDS/NRLA Joint Guide to Product Lifespans. Adjudicators use these ranges as a reference when applying the betterment principle. The medium quality column is the most commonly applicable starting point for standard rental properties.</p>
      </div>
    </div>` : '';

  UI.render(`
    ${UI.wizardHtml(7)}
    <div class="page-header">
      <div class="eyebrow">Screen 7 of 7 — Debrief &amp; Learning</div>
      <h1>Practice Session Debrief</h1>
      <p>Review what worked, what weakened your case, the ideal submission, and what TDS guidance says about this claim type.</p>
    </div>

    <!-- Score -->
    <div class="score-meter mb-3">
      <div class="score-label">Overall Recovery Rate</div>
      <div class="score-ring ${scoreClass}" role="img" aria-label="${debrief.score}% score">${debrief.score}%</div>
      <div class="score-text"><strong>${scoreLabel}</strong></div>
      <div style="font-size:0.875rem;color:var(--text-secondary);margin-top:0.375rem">${UI.formatGBP(result.totalAwarded)} awarded of ${UI.formatGBP(result.totalClaimed)} claimed — ${UI.formatGBP(result.totalReturned)} returned to tenant</div>
    </div>

    <!-- Per-claim breakdown -->
    <div class="card mb-3">
      <div class="card-header"><span class="t-h3">Claim-by-Claim Breakdown</span></div>
      <div class="card-body">${claimBreakdownHtml || '<p class="t-small t-muted">No deductions submitted.</p>'}</div>
    </div>

    <!-- What worked / what weakened -->
    <div class="debrief-grid mb-3">
      <div class="debrief-card positive">
        <div class="debrief-card-title">What You Did Well</div>
        ${wellDoneHtml}
      </div>
      <div class="debrief-card negative">
        <div class="debrief-card-title">What Weakened Your Case</div>
        ${weaknessHtml}
      </div>
    </div>

    <!-- Ideal bundle -->
    ${idealHtml ? `<div class="debrief-card ideal mb-3">
      <div class="debrief-card-title">What a Model Submission Would Have Included</div>
      ${idealHtml}
    </div>` : ''}

    <!-- TDS guidance per claim type -->
    <div class="card mb-3">
      <div class="card-header"><span class="t-h3">What TDS Guidance Says</span><span class="badge badge-navy">Industry Standards</span></div>
      <div class="card-body">${guidanceHtml}</div>
    </div>

    <!-- Legal principles -->
    ${principlesHtml ? `<div class="card mb-3">
      <div class="card-header"><span class="t-h3">Legal Principles Applied in This Decision</span></div>
      <div class="card-body">${principlesHtml}</div>
    </div>` : ''}

    <!-- Product lifespan table -->
    ${lifespanTableHtml}

    <!-- Key learning -->
    <div class="key-principle mb-3">
      <div class="key-principle-icon">${ICONS.book}</div>
      <div>
        <div class="key-principle-label">Scenario ${s.id} — Key Learning Point</div>
        <div class="key-principle-text">${UI.escHtml(s.keyLearning)}</div>
      </div>
    </div>

    <!-- Actions -->
    <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-top:2rem;padding-bottom:1rem">
      <button class="btn btn-primary btn-lg" onclick="retryScenario()">${ICONS.refresh} Retry This Scenario</button>
      <button class="btn btn-secondary btn-lg" onclick="goHome()">${ICONS.home} Try Another Scenario</button>
    </div>
  `);

  UI.setFooter(false);
}

function retryScenario() { const id=STATE.scenarioId; STATE.reset(); STATE.scenarioId=id; STATE.screen=2; renderScreen2(); }
function goHome() { STATE.reset(); renderScreen1(); }

/* ═══════════════════════════════════════════════════════════════════════════
   NAVIGATION CONTROLLER
═══════════════════════════════════════════════════════════════════════════ */
const NAV = {
  back() {
    const s = STATE.screen;
    if (s<=1) return;
    if (s===2) { STATE.screen=1; renderScreen1(); return; }
    if (s===3) { STATE.screen=2; renderScreen2(); return; }
    if (s===4) { STATE.screen=3; renderScreen3(); return; }
    if (s===5) { STATE.screen=4; renderScreen4(); return; }
    if (s===6) { STATE.screen=5; renderScreen5(); return; }
    if (s===7) { STATE.screen=6; renderScreen6(); return; }
  },
  next() {
    const s = STATE.screen;
    if (s===2) { STATE.screen=3; renderScreen3(); return; }
    if (s===3) {
      if (!validateScreen3()) {
        UI.showModal('Incomplete Deductions','Please complete all required fields — category, amount (£1–£9,999.99), and justification (min 20 characters) — before continuing.');
        return;
      }
      STATE.screen=4; renderScreen4(); return;
    }
    if (s===4) { STATE.screen=5; renderScreen5(); return; }
    if (s===5) {
      const rl = GOVERNANCE.checkRateLimit();
      if (!rl.allowed) {
        UI.showModal('Submission Limit Reached',`You have reached the maximum of ${GOVERNANCE.RATE_LIMIT.maxSubmissions} submissions per hour. Please wait approximately ${rl.waitMin} minute(s) before submitting again.`);
        return;
      }
      STATE.adjudicatorResult = ADJUDICATOR.process(STATE);
      STATE.debriefData = DEBRIEF.generate(STATE.adjudicatorResult, STATE);
      GOVERNANCE.logSession(STATE.scenarioId, STATE.scenario().deposit, STATE.adjudicatorResult.totalAwarded);
      STATE.screen=6; renderScreen6(); return;
    }
    if (s===6) { STATE.screen=7; renderScreen7(); return; }
  }
};

      stat: 'Redecoration claims account for approximately 32% of TDS disputes. A significant proportion are either rejected entirely or substantially reduced because the decoration lifecycle has expired, the check-in inventory did not confirm fresh decoration, or the damage described falls within fair wear and tear.',
      tdsQuote: '"A tenant is not obliged to redecorate to remedy deterioration that falls within fair wear and tear. Scuffs and minor marks from normal occupation are expected after several years. The adjudicator looks for evidence of damage beyond that which daily living would produce." — mydeposits',
      tips: ['Confirm in the check-in inventory that decoration was freshly applied, with a note of the approximate date and colour. \'Freshly painted\' carries more weight than \'good condition\'.', 'For any tenancy of 4+ years, be realistic — the decoration lifecycle (typically 5–7 years) may be substantially or fully consumed. Calculate the proportional award before claiming.', 'The checkout report must identify specific rooms and specific areas of damage — not just \'walls marked throughout\'. The adjudicator needs to understand exactly what requires remediation and why it exceeds wear and tear.', 'A professional decorator\'s invoice with a room-by-room breakdown, combined with a before/after photographic record from the decorator, significantly strengthens the claim.']
    },
    rent_arrears: {
      stat: 'Rent arrears claims account for approximately 19% of TDS disputes. These are the most mathematically verifiable claims — but they frequently fail or are reduced due to incomplete rent schedules, missing bank statement corroboration, or an inadequate correspondence trail.',
      tdsQuote: '"The adjudicator will want to see a clear and reconciled record of all payments due and received, supported by bank statement evidence, and a documented trail of formal demands sent to the tenant." — DPS Guidance',
      tips: ['Reconcile your rent schedule against bank statements before submission. Any gap or discrepancy in your records that the tenant can explain will reduce your award.', 'Bank statements covering the full tenancy period are the primary corroborating document. Partial bank statements raise questions about what the complete picture shows.', 'A sustained correspondence trail is essential — aim for at least three formal written email demands, each clearly dated, each naming the amount outstanding. One text message or informal request is not sufficient.', 'If the tenant has submitted any payment evidence, address it directly. Submitting a schedule that ignores a payment the tenant can prove they made destroys credibility with the adjudicator.']
    },
    gardening: {
      stat: 'Garden claims are among the most commonly rejected claims. The two primary failure modes are: a tenancy agreement clause that is too vague to establish specific obligations, and a lack of comparative photographic evidence showing what the garden looked like at both check-in and check-out.',
      tdsQuote: '"\'Maintain in reasonable condition\' is too vague to enforce specific maintenance obligations. A strong garden clause will name the specific obligations: mowing frequency, hedge-cutting schedule, weed control requirements." — TDS Academy',
      tips: ['Review the tenancy agreement garden clause before claiming. If it is vague, acknowledge this limitation and consider whether the claim is worth pursuing.', 'Check-in photographs of the garden are essential — an outdoor space can change dramatically between seasons. Without a clear baseline, the adjudicator cannot determine whether the condition at check-out represents deterioration or seasonal variation.', 'Check-out photographs should be taken against the same viewpoints as check-in photographs where possible, to enable direct comparison.', 'Seasonal context matters — a garden checked out in autumn will naturally look different from one checked in during spring. The adjudicator will consider this.']
    },
    other: {
      stat: 'For all claim types, the core principle is the same: establish a clear baseline at the start of the tenancy, document the deterioration at the end, demonstrate that it exceeds fair wear and tear, and provide professional financial evidence of the cost.',
      tdsQuote: '"Without an inventory, it is very difficult, if not impossible, to prove what condition the property was in at the start of the tenancy." — TDS',
      tips: ['A professional AIIC-registered inventory with a photographic schedule is the single most important document in any deposit dispute.', 'Every claim must be grounded in the tenancy agreement — identify the specific clause that creates the obligation before claiming.', 'Only claim what you can evidence. Over-claiming damages credibility with the adjudicator and may result in a reduced award even on well-evidenced items.', 'Obtain professional contractor invoices with VAT numbers, property addresses, and itemised breakdowns. Self-prepared estimates carry very limited weight.']
    }
  },

  getClaimGuidance(category) {
    const cat = (category || '').toLowerCase().replace(/\s+/g,'_');
    if (cat.includes('clean')) return this.claimGuidance.cleaning;
    if (cat.includes('damage')) return this.claimGuidance.damage;
    if (cat.includes('redecor') || cat.includes('decoration')) return this.claimGuidance.redecoration;
    if (cat.includes('rent') || cat.includes('arrear')) return this.claimGuidance.rent_arrears;
    if (cat.includes('garden')) return this.claimGuidance.gardening;
    return this.claimGuidance.other;
  },

  generate(adjResult, state) {
    const scenario = adjResult.scenario;
    const results  = adjResult.deductionResults;
    const totalClaimed = adjResult.totalClaimed;
    const totalAwarded = adjResult.totalAwarded;
    const score = totalClaimed > 0 ? Math.round((totalAwarded / totalClaimed) * 100) : 0;

    const wellDone = [];
    const weaknesses = [];

    results.forEach(r => {
      const catLabel = r.category ? r.category.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()) : 'this claim';
      if (r.outcomeType === 'full') {
        wellDone.push(`${catLabel}: Full award of ${UI.formatGBP(r.awarded)} achieved. Your evidence bundle established the claim on the balance of probabilities — baseline, comparative evidence, and financial documentation were all present and credible.`);
      }
      if (r.outcomeType === 'nil') {
        weaknesses.push(`${catLabel}: Nil award — the claim was not upheld. ${r.gapsNoted[0] || 'Essential evidence was missing or insufficient to establish the claim.'}`);
      }
      if (r.outcomeType === 'partial') {
        const principle = r.legalPrinciple ? ` The adjudicator applied the ${r.legalPrinciple.replace(/_/g,' ')} principle.` : '';
        weaknesses.push(`${catLabel}: Partial award of ${UI.formatGBP(r.awarded)} from ${UI.formatGBP(r.claimed)} claimed (${Math.round((r.awarded/r.claimed)*100)}% recovery).${principle} ${r.gapsNoted[0] ? r.gapsNoted[0] : ''}`);
      }
      if (r.outcomeType === 'nominal') {
        weaknesses.push(`${catLabel}: Nominal award only (${UI.formatGBP(r.awarded)}). The adjudicator found some basis for the claim but the evidential foundation was too weak to support a meaningful award. ${r.gapsNoted[0] || ''}`);
      }
      // Praise good evidence selection
      const strongClean = r.evidenceConsidered.filter(e => e.weight === 'strong' && !e.flaw);
      if (strongClean.length >= 3 && r.outcomeType !== 'nil') {
        wellDone.push(`${catLabel}: You included ${strongClean.length} strong, unflawed evidence items — this is the foundation of a credible submission.`);
      }
      // Penalise irrelevant/adverse items
      const irrelevant = r.evidenceConsidered.filter(e => e.flaw === 'irrelevant');
      if (irrelevant.length > 0) {
        weaknesses.push(`${catLabel}: ${irrelevant.length} irrelevant document(s) were included in your bundle. Over-bundling with material unrelated to the claim can undermine the adjudicator's confidence in the overall submission.`);
      }
      const adverse = r.evidenceConsidered.filter(e => e.flaw === 'adverse');
      if (adverse.length > 0) {
        weaknesses.push(`${catLabel}: An adverse document was included that actively supported the tenant's position. Always review every piece of evidence for what it says before including it.`);
      }
    });

    // Ideal bundle for this scenario
    const idealMap = {
      1: [
        'A professional AIIC-registered check-in inventory with an embedded photographic schedule (not a landlord-prepared checklist)',
        'Dated check-out photographs showing specific areas of uncleanliness — oven interior, extractor, bathroom limescale, floor soiling',
        'Professional checkout report from an independent clerk with room-by-room condition notes',
        'Invoice from a VAT-registered professional cleaning company with a room-by-room cost breakdown and the property address',
        'Tenancy agreement cleaning clause — confirming the standard required at check-out'
      ],
      2: [
        'Professional check-in inventory with photographs noting the carpet\'s age, quality, and condition at commencement',
        'Checkout inventory signed by the tenants with photographs clearly showing the staining extent',
        'Full replacement invoice from a VAT-registered flooring company with supply and fit breakdown',
        'A betterment calculation submitted alongside the invoice — showing age at end of tenancy as a proportion of lifecycle',
        'Comparative quote from a second supplier confirming market rate'
      ],
      3: [
        'Fully reconciled rent schedule cross-referenced against bank statements — with the January payment acknowledged and accounted for',
        'Bank statements covering the entire tenancy period (not partial)',
        'Three or more formal written email demands — dated, naming the amount outstanding each time',
        'Signed tenancy agreement rent clause confirming amount and due date',
        'Tenant acknowledgement of any demand (even a refusal to pay counts as evidence the demand was received)'
      ],
      4: [
        'Check-in inventory confirming fresh decoration with specific notes ("freshly painted magnolia, no marks or damage") and photographs',
        'Checkout inventory and photographs identifying specific rooms and specific areas of damage — with commentary on why this exceeds fair wear and tear for a 4-year tenancy',
        'Professional decorator invoice with room-by-room breakdown from a VAT-registered company',
        'Comparative quote from a second decorator confirming the market rate',
        'A lifecycle proportion calculation — acknowledging the decoration lifecycle and calculating the proportional claimable amount (not the full invoice)'
      ],
      5: [
        'A tenancy agreement garden clause with specific, named obligations — mowing frequency, hedge-cutting, weed control',
        'Dated check-in photographs of the garden showing its condition at commencement (including lawn, hedges, and borders)',
        'Dated check-out photographs from the same viewpoints showing the deterioration',
        'Professional checkout report with a dedicated garden section noting specific issues',
        'Invoice from a VAT-registered garden contractor with a breakdown of work carried out'
      ],
      6: [
        'Check-in inventory countersigned by the tenant at commencement — or sent to the tenant for review with no objection recorded',
        'Dated photographs clearly showing each disputed item in its location at the start of the tenancy',
        'Professional checkout report listing each missing item by name and location',
        'Purchase receipts or dated photographs showing the items existed before the tenancy',
        'Replacement invoices from reputable suppliers with like-for-like descriptions'
      ],
      7: [
        'CLEANING: Check-in inventory + checkout report + dated photographs + VAT-registered professional cleaning invoice with room breakdown',
        'DAMAGE: Check-in photographs showing table in good condition + checkout photos showing damage + replacement invoice + explicit betterment calculation (1/8 = 12.5% of £350 claimable)',
        'ARREARS: Reconciled rent schedule + full-year bank statements + minimum three formal written demands + tenant acknowledgement of at least one demand',
        'ALL CLAIMS: Each claim must stand on its own evidence chain — strength in one claim does not compensate for weakness in another'
      ],
      8: [
        'Check-in inventory and dated photographs recording the original decorative finish at commencement — establishing what the tenant altered',
        'Checkout report and dated photographs showing the altered finish, enabling a direct before-and-after comparison',
        'The specific tenancy agreement clause prohibiting alterations or requiring the landlord\'s prior written consent to redecorate (not a generic "good condition" clause)',
        'Correspondence — or a signed statement — showing that consent was never sought or was expressly refused',
        'A professional reinstatement invoice from a VAT-registered decorator (not merely a quotation) with an itemised, reasonable cost'
      ],
      9: [
        'The judgement to recognise before claiming that the professional clean already claimed covers these same areas — a separate specialist-treatment charge for that work is double recovery and will not be awarded twice',
        'A specific tenancy agreement clause obliging the tenant to fund the specialist treatment claimed — a general pet-permission or "free of odour" clause is not enough',
        'Independent evidence that a genuine infestation or contamination existed (e.g. a professional pest-control report) — not an assertion or a self-prepared recommendation',
        'An invoice for treatment actually carried out — a quotation alone does not establish that any cost was incurred',
        'The discipline to withdraw a weak, duplicative claim rather than over-bundle: over-claiming undermines credibility on the claims that are genuinely sound'
      ]
    };

    return {
      score,
      wellDone,
      weaknesses,
      idealBundle: idealMap[scenario.id] || [],
      keyLearning: scenario.keyLearning,
      legalPrinciples: [...new Set(results.map(r => r.legalPrinciple).filter(Boolean))],
      claimCategories: [...new Set(results.map(r => r.category).filter(Boolean))],
      deductionResults: results
    };
  }
};
</script>
