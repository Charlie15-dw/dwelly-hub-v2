/* ═══════════════════════════════════════════════════════════════════════════
   APPLICATION STATE
═══════════════════════════════════════════════════════════════════════════ */
const STATE = {
  screen: 1,
  scenarioId: null,
  deductions: [],        // [{id, category, amount, justification}]
  evidenceSelections: {},// { deductionId: [{evidenceId, coveringNote}] }
  adjudicatorResult: null,
  debriefData: null,

  reset() {
    this.screen = 1; this.scenarioId = null;
    this.deductions = []; this.evidenceSelections = {};
    this.adjudicatorResult = null; this.debriefData = null;
  },

  scenario() { return this.scenarioId ? SCENARIOS[this.scenarioId] : null; },

  totalClaimed() {
    return this.deductions.reduce((s, d) => s + (parseFloat(d.amount) || 0), 0);
  },

  addDeduction() {
    const id = 'ded_' + Date.now();
    this.deductions.push({ id, category: '', amount: '', justification: '' });
    this.evidenceSelections[id] = [];
    return id;
  },

  removeDeduction(id) {
    this.deductions = this.deductions.filter(d => d.id !== id);
    delete this.evidenceSelections[id];
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   ADJUDICATOR ENGINE
═══════════════════════════════════════════════════════════════════════════ */
const ADJUDICATOR = {

  process(state) {
    const scenario = state.scenario();
    const results = [];

    state.deductions.forEach(ded => {
      const selectedIds = (state.evidenceSelections[ded.id] || []).map(e => e.evidenceId);
      const selectedItems = scenario.evidencePool.filter(e => selectedIds.includes(e.id));
      const result = this.assessClaim(ded, selectedItems, scenario, state);
      results.push(result);
    });

    const totalClaimed  = results.reduce((s, r) => s + r.claimed, 0);
    const totalAwarded  = results.reduce((s, r) => s + r.awarded, 0);
    const totalReturned = Math.max(0, scenario.deposit - totalAwarded);

    return {
      caseRef: this.generateRef(scenario.id),
      scenario,
      deductionResults: results,
      totalClaimed,
      totalAwarded,
      totalReturned,
      depositAmount: scenario.deposit,
      closingRemarks: this.closingRemarks(results, totalAwarded, scenario.deposit)
    };
  },

  assessClaim(ded, items, scenario, state) {
    const claimed = parseFloat(ded.amount) || 0;
    let score = 0;
    let awarded = 0;
    let outcomeType = 'nil';
    let reasoning = [];
    let gapsNoted = [];
    let legalPrinciple = null;
    let evidenceConsidered = [];

    const hasType  = (t) => items.some(i => i.type === t && i.flaw !== 'irrelevant' && i.flaw !== 'adverse');
    const hasRole  = (r) => items.some(i => i.role === r && i.flaw !== 'irrelevant' && i.flaw !== 'adverse');
    const itemsOf  = (t) => items.filter(i => i.type === t && i.flaw !== 'irrelevant');
    const strongOf = (t) => items.filter(i => i.type === t && i.weight === 'strong' && !i.flaw);
    const hasFlawed = () => items.some(i => i.flaw && i.flaw !== 'irrelevant');
    const hasIrrelevant = () => items.some(i => i.flaw === 'irrelevant');
    const hasAdverse = () => items.some(i => i.flaw === 'adverse');

    // Build evidence considered list — include PM's covering notes
    items.forEach(item => {
      if (item.flaw !== 'irrelevant') {
        const sel = (state.evidenceSelections[ded.id] || []).find(e => e.evidenceId === item.id);
        const coveringNote = sel ? (sel.coveringNote || '').trim() : '';
        evidenceConsidered.push({ title: item.title, weight: item.weight, flaw: item.flaw, coveringNote });
      }
    });

    // ── SCENARIO-SPECIFIC TRAP LOGIC ───────────────────────────────────────
    if (scenario.trap === 'no_photo_checkin') {
      const hasPhotoBaseline = items.some(i => i.id === 'e1_3' && !i.flaw) ||
                               items.some(i => i.type === 'baseline' && i.weight === 'strong');
      const hasCheckout     = hasType('comparative');
      const hasInvoice      = items.some(i => i.id === 'e1_4' || (i.type === 'financial' && i.weight === 'strong'));
      const hasContractual  = hasType('contractual');

      if (!hasCheckout && !hasInvoice) {
        outcomeType = 'nil'; awarded = 0;
        reasoning.push('The adjudicator has considered the evidence submitted in support of this claim. The landlord has not provided any professional checkout documentation establishing the condition of the property at vacation, nor any financial evidence of the remediation costs said to have been incurred. Without these foundational documents, the adjudicator is unable to establish, on the balance of probabilities, that a cleaning liability arose or that the amount claimed was reasonably incurred.');
        reasoning.push('The deposit is presumed to belong to the tenant. In the absence of evidence sufficient to displace that presumption, the adjudicator makes no award in respect of this claim.');
        gapsNoted.push('No professional checkout report submitted. No cleaning invoice or estimate submitted. These are the two most fundamental documents in any cleaning claim.');
      } else {
        score += hasCheckout ? 25 : 0;
        score += hasInvoice  ? 30 : 0;
        score += hasContractual ? 15 : 0;
        score += hasPhotoBaseline ? 20 : 0;

        if (!hasPhotoBaseline) {
          gapsNoted.push('The check-in document provided is a landlord-prepared checklist rather than a professional inventory produced by an independent clerk. It contains no photographic schedule. The adjudicator notes that without independent professional documentation and a photographic baseline, the comparison of cleanliness is limited to the landlord\'s own narrative notes, which carry reduced evidential weight.');
          legalPrinciple = 'missing_baseline';
          score -= 20;
        }
        if (score >= 60) {
          outcomeType = 'full'; awarded = claimed;
          reasoning.push('The adjudicator has considered the evidence submitted and is satisfied, on the balance of probabilities, that the property was not returned in the standard of cleanliness required by the tenancy agreement. The professional checkout report from an independent clerk documents the specific areas of uncleanliness at the point of vacation, and the cleaning invoice from a VAT-registered company provides a credible, proportionate cost.');
          reasoning.push('The adjudicator is satisfied that the cleaning deficit is established and that the cost claimed is reasonable. The full amount is awarded.');
        } else if (score >= 35) {
          outcomeType = 'partial'; awarded = Math.round(claimed * 0.65 * 100) / 100;
          reasoning.push('The adjudicator has considered the evidence submitted. The professional checkout report and cleaning invoice establish that cleaning was required at the end of the tenancy and that a cost was incurred. However, the adjudicator notes that the check-in document is a landlord-prepared checklist rather than a professionally produced inventory, and it contains no photographic schedule.');
          reasoning.push('Without a photographic baseline established by an independent clerk, the adjudicator cannot make a full before-and-after comparison and cannot be fully satisfied that the entire cleaning cost is attributable to the outgoing tenant rather than to a pre-existing condition. A reduction of 35% is applied to reflect this material evidential limitation. Had a professional AIIC check-in inventory with a photographic schedule been submitted, the full amount may have been awarded.');
        } else {
          outcomeType = 'nominal'; awarded = Math.round(claimed * 0.30 * 100) / 100;
          reasoning.push('The adjudicator finds some basis for the cleaning claim but is not satisfied that the full amount is established on the balance of probabilities. The evidential foundation is insufficient: the baseline documentation does not establish the standard at the start of the tenancy with the reliability required to support a substantial cleaning award.');
          reasoning.push('A nominal award only is made to reflect that some cleaning obligation existed under the tenancy agreement, without which no award would be possible at all.');
        }
      }
    }

    else if (scenario.trap === 'betterment_carpet') {
      const hasBaseline   = items.some(i => i.id === 'e2_1' || (i.type === 'baseline' && i.weight === 'strong'));
      const hasComparison = items.some(i => i.type === 'comparative' && i.weight === 'strong');
      const hasInvoice    = items.some(i => i.id === 'e2_4' || (i.type === 'financial' && i.weight === 'strong'));

      if (!hasBaseline || !hasComparison) {
        outcomeType = 'nil'; awarded = 0;
        reasoning.push('The adjudicator cannot establish the condition of the carpet at the commencement of the tenancy without a baseline inventory or comparative evidence showing the change in condition.');
        gapsNoted.push('No clear before-and-after comparison evidence provided.');
      } else {
        // Betterment calculation
        const age = scenario.carpetAgeAtStart;           // 6
        const lifecycle = scenario.carpetLifecycle;       // 10
        const tenancyYrs = scenario.tenancyMonths / 12;  // 2
        const ageAtEnd = age + tenancyYrs;                // 8
        const remainingLife = lifecycle - ageAtEnd;       // 2
        const bettermentFactor = Math.max(0, remainingLife / lifecycle); // 0.2

        legalPrinciple = 'betterment';
        const bettermentAward = Math.round(claimed * bettermentFactor * 100) / 100;

        if (hasInvoice) {
          outcomeType = 'partial'; awarded = bettermentAward;
          reasoning.push(`The adjudicator is satisfied that damage to the carpet has been established on the balance of probabilities by reference to the check-in and check-out evidence. The damage clearly exceeds fair wear and tear. However, the adjudicator must apply the betterment principle.`);
          reasoning.push(`The carpet was ${age} years old at the commencement of the tenancy and the standard carpet lifecycle is ${lifecycle} years. At the end of the ${tenancyYrs}-year tenancy the carpet had reached ${ageAtEnd} years of age, leaving ${remainingLife} year(s) of anticipated useful life. The adjudicator therefore awards ${Math.round(bettermentFactor * 100)}% of the claimed amount of £${claimed.toFixed(2)}, being £${bettermentAward.toFixed(2)}.`);
          gapsNoted.push(`Betterment applied: carpet age at end of tenancy (${ageAtEnd} years) against lifecycle of ${lifecycle} years. Award reflects remaining useful life only.`);
        } else {
          outcomeType = 'nominal'; awarded = Math.round(bettermentAward * 0.7 * 100) / 100;
          reasoning.push('The adjudicator is satisfied damage occurred but the absence of a credible financial document for the replacement means only a nominal award can be made, further reduced by betterment.');
          gapsNoted.push('No verified replacement invoice provided.');
        }
      }
    }

    else if (scenario.trap === 'rent_schedule_gap') {
      const hasGappedSchedule   = items.some(i => i.id === 'e3_1');
      const hasReconciledSchedule = items.some(i => i.id === 'e3_2');
      const hasBankStatements   = items.some(i => i.id === 'e3_3' || (i.type === 'financial' && i.weight === 'strong'));
      const hasCorrespondence   = items.some(i => (i.id === 'e3_6' || i.id === 'e3_7') && !i.flaw);
      const hasContractual      = hasType('contractual');

      if (hasGappedSchedule && !hasReconciledSchedule) {
        // Trap triggered — schedule shows gap, adjudicator reduces
        outcomeType = 'partial'; awarded = Math.round(claimed * 0.667 * 100) / 100;
        reasoning.push('The adjudicator has reviewed the rent schedule submitted. The schedule does not account for a payment in January of the tenancy year for which the tenant has provided a payment receipt. The adjudicator notes this discrepancy.');
        reasoning.push('As the rent schedule as submitted cannot be reconciled with the tenant\'s payment evidence, the adjudicator is unable to accept the full arrears figure. The award is reduced to reflect the unaccounted payment, resulting in an award for the two confirmed outstanding months only.');
        gapsNoted.push('Rent schedule contains an unexplained gap for January. Tenant holds a payment receipt for this period. The adjudicator has reduced the award accordingly.');
        legalPrinciple = 'financial_accuracy';
      } else if (hasReconciledSchedule && hasBankStatements) {
        score = 85;
        if (hasCorrespondence) score += 10;
        if (hasContractual)   score += 5;
        outcomeType = 'full'; awarded = claimed;
        reasoning.push('The adjudicator is satisfied that the rent arrears claim is supported on the balance of probabilities. The reconciled rent schedule, supported by bank statement evidence, clearly establishes the outstanding amount. Written demands were issued to the tenant and remain unanswered. The adjudicator awards the full amount claimed.');
      } else {
        outcomeType = 'nominal'; awarded = Math.round(claimed * 0.4 * 100) / 100;
        reasoning.push('Insufficient financial evidence to establish the full arrears amount with confidence. Only a nominal award is made.');
        gapsNoted.push('Bank statements and/or a reconciled rent schedule not provided.');
      }
    }

    else if (scenario.trap === 'decoration_lifecycle') {
      const hasBaseline   = items.some(i => i.type === 'baseline' && i.weight === 'strong');
      const hasComparison = items.some(i => i.type === 'comparative' && i.weight === 'strong');
      const hasInvoice    = items.some(i => i.type === 'financial' && i.weight === 'strong' && !i.flaw);
      const hasComparativeQuote = items.some(i => i.id === 'e4_6');

      if (!hasBaseline || !hasComparison) {
        outcomeType = 'nil'; awarded = 0;
        gapsNoted.push('No baseline or comparative evidence of decoration condition provided.');
        reasoning.push('The adjudicator cannot make an award in the absence of evidence establishing the decoration condition at the start and end of the tenancy.');
      } else {
        // Decoration lifecycle calculation
        const lifecycle = scenario.decorationLifecycle;             // 6
        const tenancyYrs = scenario.tenancyMonths / 12;            // 4
        const remainingProportion = Math.max(0, (lifecycle - tenancyYrs) / lifecycle); // 2/6 = 0.333
        legalPrinciple = 'decoration_lifecycle';

        const proportionalAward = Math.round(claimed * remainingProportion * 100) / 100;

        if (hasInvoice) {
          outcomeType = 'partial'; awarded = proportionalAward;
          const pct = Math.round(remainingProportion * 100);
          reasoning.push(`The adjudicator is satisfied that the decoration at the property was damaged beyond fair wear and tear as evidenced by the check-in inventory, checkout report, and supporting photographs. The damage clearly exceeds what would be expected from ${tenancyYrs} years of reasonable occupation.`);
          reasoning.push(`However, the adjudicator applies the decoration lifecycle principle. The property was freshly decorated at the commencement of the tenancy. A standard decoration lifecycle of ${lifecycle} years is recognised. The tenancy ran for ${tenancyYrs} years, meaning ${pct}% of the decoration lifecycle remained at the end of the tenancy. The adjudicator awards ${pct}% of the claimed amount (£${claimed.toFixed(2)}), being £${proportionalAward.toFixed(2)}.`);
          if (!hasComparativeQuote) {
            awarded = Math.round(proportionalAward * 0.9 * 100) / 100;
            gapsNoted.push('Only one comparative quote was provided. The adjudicator applies a modest further reduction to reflect this limitation.');
          }
        } else {
          outcomeType = 'nominal'; awarded = Math.round(proportionalAward * 0.6 * 100) / 100;
          reasoning.push('Some evidence of decoration damage has been submitted but financial evidence is insufficient. A nominal award only is made, further reduced by the decoration lifecycle principle.');
          gapsNoted.push('No credible financial invoice for redecoration works provided.');
        }
      }
    }

    else if (scenario.trap === 'vague_clause_and_no_comparison') {
      const hasSpecificClause = items.some(i => i.id === 'e5_2');
      const hasVagueClause    = items.some(i => i.id === 'e5_1');
      const hasCheckIn        = items.some(i => i.id === 'e5_3' && i.type === 'baseline');
      const hasCheckOut       = items.some(i => i.id === 'e5_4' && i.type === 'comparative');
      const hasInvoice        = items.some(i => i.type === 'financial' && i.weight === 'strong' && !i.flaw);

      if (!hasCheckIn && !hasCheckOut) {
        outcomeType = 'nil'; awarded = 0;
        reasoning.push('In the absence of any photographic evidence of the garden condition at the commencement and conclusion of the tenancy, the adjudicator is unable to establish the extent of any deterioration attributable to the tenant. This claim cannot be upheld.');
        gapsNoted.push('No check-in or check-out photographs of the garden submitted.');
        legalPrinciple = 'missing_baseline';
      } else if (!hasSpecificClause && hasVagueClause) {
        // Vague clause trap
        outcomeType = 'nominal'; awarded = hasInvoice ? Math.round(claimed * 0.25 * 100) / 100 : 0;
        reasoning.push('The tenancy agreement clause on garden maintenance (Clause 19) is noted. The adjudicator finds the clause insufficiently specific to establish the precise obligations the landlord seeks to enforce. The clause refers to maintaining the garden in a "reasonable condition" but does not define the standard, specify maintenance frequency, or enumerate specific obligations.');
        reasoning.push('The adjudicator will not infer obligations not clearly stated in the tenancy agreement. Without a precise contractual basis, only a nominal award can be made reflecting the general obligation of reasonable care, which falls short of the full clearance costs claimed.');
        gapsNoted.push('Garden maintenance clause is insufficiently specific. Vague clauses will not support full deduction claims.');
        legalPrinciple = 'contractual_basis';
      } else if (hasSpecificClause && hasCheckIn && hasCheckOut && hasInvoice) {
        outcomeType = 'full'; awarded = claimed;
        reasoning.push('The adjudicator is satisfied that the tenancy agreement clearly specifies the garden maintenance obligations. The photographic evidence establishes a clear before-and-after comparison demonstrating that the garden was not maintained in accordance with the tenancy obligations. The professional invoice is accepted as evidence of the reasonable remediation cost.');
      } else {
        outcomeType = 'partial'; awarded = Math.round(claimed * 0.55 * 100) / 100;
        reasoning.push('Some evidence has been submitted in support of the gardening claim but gaps in either the contractual basis or comparative photographic evidence prevent a full award.');
        if (!hasCheckIn) gapsNoted.push('Check-in photographs of garden not submitted.');
        if (!hasCheckOut) gapsNoted.push('Check-out photographs of garden not submitted.');
        if (!hasSpecificClause) gapsNoted.push('Specific garden maintenance clause not submitted.');
      }
    }

    else if (scenario.trap === 'unsigned_inventory') {
      const hasUnsignedInventory = items.some(i => i.id === 'e6_1');
      const hasPhotosInSitu      = items.some(i => i.id === 'e6_2');
      const hasCheckout          = items.some(i => i.id === 'e6_3');
      const hasInvoice           = items.some(i => i.id === 'e6_5');
      const hasAdverseEmail      = items.some(i => i.id === 'e6_8');
      const hasPurchaseReceipts  = items.some(i => i.id === 'e6_11');

      if (hasAdverseEmail) {
        // Adverse document included — this hurts the claim
        outcomeType = 'nil'; awarded = 0;
        reasoning.push('The adjudicator notes that the submission includes a contemporaneous email from the tenant dated shortly after tenancy commencement in which the tenant raises concerns about the absence of certain items in the property. This email, submitted within the evidence bundle, creates a significant doubt as to whether all of the claimed items were in fact present at the commencement of the tenancy.');
        reasoning.push('Given this contemporaneous dispute of the baseline, and noting that the check-in inventory was not countersigned by the tenant, the adjudicator is unable to establish on the balance of probabilities that the claimed items were present and accounted for at the start of the tenancy. This claim cannot be upheld.');
        gapsNoted.push('An adverse document was included in the bundle that supports the tenant\'s position. Review all evidence carefully before submission.');
        legalPrinciple = 'evidential_weight';
      } else if (!hasPhotosInSitu && hasUnsignedInventory && !hasPurchaseReceipts) {
        outcomeType = 'nil'; awarded = 0;
        reasoning.push('The sole baseline document is an inventory that was not countersigned by the tenant. In the absence of any corroborating evidence that the claimed items were present at the commencement of the tenancy — such as photographs of the items in situ or purchase records — the adjudicator cannot establish the baseline on the balance of probabilities. This claim cannot be upheld.');
        gapsNoted.push('Unsigned inventory without corroborating photographic or financial baseline evidence.');
        legalPrinciple = 'evidential_weight';
      } else if (hasPhotosInSitu && hasCheckout && hasInvoice) {
        outcomeType = 'full'; awarded = claimed;
        reasoning.push('The adjudicator notes that the check-in inventory was not countersigned by the tenant. However, the submission includes dated photographs clearly showing the disputed items in situ at the commencement of the tenancy. This photographic evidence corroborates the inventory and provides a reliable baseline. The checkout report identifies the items as absent and the replacement invoice is from a reputable supplier. The adjudicator is satisfied the claim is established on the balance of probabilities.');
      } else if (hasPhotosInSitu || hasPurchaseReceipts) {
        outcomeType = 'partial'; awarded = Math.round(claimed * 0.7 * 100) / 100;
        reasoning.push('Some corroborating evidence of the items\' presence at the start of the tenancy has been submitted. The adjudicator notes the unsigned inventory but finds that the additional evidence provides partial support for the baseline. A partial award is made, reduced to reflect the evidential limitation of the unsigned inventory.');
        gapsNoted.push('Unsigned inventory reduces the weight of the baseline claim. Full award requires corroborating photograph or purchase evidence.');
        legalPrinciple = 'evidential_weight';
      } else {
        outcomeType = 'nil'; awarded = 0;
        reasoning.push('Insufficient corroborating evidence to support the baseline established by the unsigned inventory.');
        gapsNoted.push('Unsigned inventory without corroboration cannot establish the baseline.');
      }
    }

    else if (scenario.trap === 'multi_claim_mixed') {
      // Multi-claim: this function handles one deduction at a time
      // Determine which claim this is based on category
      const cat = (ded.category || '').toLowerCase();

      if (cat === 'cleaning') {
        const hasBaseline   = items.some(i => i.id === 'e7_1');
        const hasCheckout   = items.some(i => i.id === 'e7_2' || i.type === 'comparative');
        const hasInvoice    = items.some(i => i.id === 'e7_3');
        const hasPhotos     = items.some(i => i.id === 'e7_4');

        if (hasBaseline && hasCheckout && hasInvoice && hasPhotos) {
          outcomeType = 'full'; awarded = claimed;
          reasoning.push('The adjudicator has considered the cleaning evidence and is satisfied, on the balance of probabilities, that the property was not returned in the required standard of cleanliness. The check-in inventory establishes the condition and standard at commencement. The checkout report and dated photographs clearly document the soiling at the point of vacation — specifically the heavily soiled oven and grease-covered extractor fan. The professional cleaning invoice provides a credible, itemised, and proportionate cost from a VAT-registered contractor. The full amount claimed is awarded.');
        } else if (hasCheckout && hasInvoice) {
          outcomeType = 'partial'; awarded = Math.round(claimed * 0.75 * 100) / 100;
          reasoning.push('The adjudicator is satisfied that cleaning was required at the end of this tenancy. The checkout documentation and professional invoice provide a sufficient basis for a substantial award. However, some evidential gaps prevent the adjudicator from awarding the full amount claimed. A reduction of 25% is applied to reflect these limitations.');
          if (!hasBaseline) gapsNoted.push('The check-in inventory was not submitted. Without a baseline establishing the condition and standard at commencement, the adjudicator cannot make a full before-and-after comparison. This is the single most common reason cleaning claims are reduced.');
        } else {
          outcomeType = 'nominal'; awarded = Math.round(claimed * 0.3 * 100) / 100;
          gapsNoted.push('Essential cleaning evidence is missing — either no checkout report, no invoice, or both. These are the minimum requirements for a cleaning claim to be considered.');
          reasoning.push('The adjudicator is not satisfied, on the balance of probabilities, that the full cleaning claim is established by the evidence submitted. Only a nominal award is made, which reflects the minimum acknowledgement that some cleaning obligation existed under the tenancy agreement.');
        }
      }
      else if (cat === 'damage') {
        const hasBaseline   = items.some(i => i.id === 'e7_1');
        const hasPhotos     = items.some(i => i.id === 'e7_4');
        const hasInvoice    = items.some(i => i.id === 'e7_5');
        const hasReceipt    = items.some(i => i.id === 'e7_6');

        if (hasBaseline && hasPhotos && hasInvoice) {
          // Betterment applies to table
          const age = scenario.tableAgeAtStart;         // 5
          const lifecycle = scenario.tableLifecycle;    // 8
          const tenancyYrs = scenario.tenancyMonths / 12; // 2
          const ageAtEnd = age + tenancyYrs;
          const remaining = Math.max(0, lifecycle - ageAtEnd);
          const factor = remaining / lifecycle;
          legalPrinciple = 'betterment';
          awarded = Math.round(claimed * factor * 100) / 100;
          outcomeType = 'partial';
          reasoning.push(`The adjudicator is satisfied that damage to the dining table has been established. The check-in inventory and checkout photographs clearly show damage beyond fair wear and tear.`);
          reasoning.push(`The betterment principle applies. The table was ${age} years old at commencement of the tenancy. Against a standard lifecycle of ${lifecycle} years, and accounting for the ${tenancyYrs}-year tenancy, only ${remaining} year(s) of useful life remained at the end of the tenancy. The adjudicator awards ${Math.round(factor*100)}% of £${claimed.toFixed(2)}, being £${awarded.toFixed(2)}.`);
          gapsNoted.push(`Betterment applied: table age at end of tenancy (${ageAtEnd} years) against lifecycle (${lifecycle} years).`);
        } else {
          outcomeType = 'nil'; awarded = 0;
          gapsNoted.push('Insufficient evidence of the damage or replacement cost.');
          reasoning.push('This claim cannot be upheld on the evidence submitted.');
        }
      }
      else if (cat === 'rent arrears' || cat === 'arrears') {
        const hasSchedule     = items.some(i => i.id === 'e7_7');
        const hasBankStatements = items.some(i => i.id === 'e7_8');
        const hasSingleEmail  = items.some(i => i.id === 'e7_9');
        const hasTexts        = items.some(i => i.id === 'e7_10');
        const strongCorrespondence = items.some(i => i.type === 'correspondence' && i.weight === 'strong');

        if (hasSchedule && hasBankStatements && strongCorrespondence) {
          outcomeType = 'full'; awarded = claimed;
          reasoning.push('The rent arrears are established by the reconciled rent schedule and corroborating bank statements. Written demands were issued and the full amount is awarded.');
        } else if (hasSchedule && hasBankStatements && (hasSingleEmail || hasTexts)) {
          outcomeType = 'partial'; awarded = Math.round(claimed * 0.65 * 100) / 100;
          legalPrinciple = 'correspondence_trail';
          reasoning.push('The rent schedule and bank statements support the arrears claim. However, the correspondence trail is weak: only a single email demand was issued and no tenant acknowledgement is on record.');
          reasoning.push('The adjudicator expects to see a sustained written record of formal demands before awarding the full arrears sum. The absence of a documented demand process leads to a partial award only.');
          gapsNoted.push('Inadequate correspondence trail: only one written demand issued, no tenant acknowledgement recorded. A sustained series of formal written demands is required to support a full arrears award.');
        } else {
          outcomeType = 'nominal'; awarded = Math.round(claimed * 0.3 * 100) / 100;
          gapsNoted.push('Insufficient financial and correspondence evidence for the arrears claim.');
          reasoning.push('The adjudicator makes only a nominal award given the limited evidence of the arrears and the absence of a documented demand process.');
        }
      }
      else {
        // Unknown category — generic assessment
        score = items.filter(i => i.weight === 'strong' && !i.flaw).length * 20;
        score += items.filter(i => i.weight === 'moderate' && !i.flaw).length * 10;
        score = Math.min(score, 100);
        if (score >= 70) {
          outcomeType = 'full'; awarded = claimed;
          reasoning.push('The adjudicator has considered the evidence submitted and is satisfied, on the balance of probabilities, that this deduction is justified. The submission included credible, independent documentation establishing the landlord\'s entitlement to the amount claimed. The full amount is awarded.');
        } else if (score >= 45) {
          outcomeType = 'partial'; awarded = Math.round(claimed * 0.6 * 100) / 100;
          reasoning.push('The adjudicator is satisfied that some basis for this deduction has been established, but evidential gaps prevent an award of the full amount claimed. The evidence submitted supports a partial award, which the adjudicator considers fair and proportionate in the circumstances.');
        } else if (score >= 20) {
          outcomeType = 'nominal'; awarded = Math.round(claimed * 0.25 * 100) / 100;
          reasoning.push('The adjudicator finds insufficient evidence to support the full amount claimed. A nominal award only is made, reflecting the limited weight that can be placed on the evidence submitted. The landlord is reminded that the burden of proof rests with the claimant, and that credible, independent evidence is required to displace the presumption that the deposit belongs to the tenant.');
        } else {
          outcomeType = 'nil'; awarded = 0;
          reasoning.push('The adjudicator is not satisfied, on the balance of probabilities, that this deduction is established by the evidence submitted. The deposit is presumed to belong to the tenant, and the evidence provided is insufficient to displace that presumption. No award is made in respect of this claim.');
        }
      }
    }

    else if (scenario.trap === 'unauthorised_alteration') {
      const hasBaseline    = items.some(i => (i.id === 'e8_1' || i.id === 'e8_2') && i.type === 'baseline');
      const hasComparison  = items.some(i => i.type === 'comparative' && i.weight === 'strong');
      const hasProhibition = items.some(i => i.id === 'e8_5');
      const hasConsentTrail= items.some(i => i.id === 'e8_7' && !i.flaw);
      const hasInvoice     = items.some(i => i.id === 'e8_8');
      const hasQuoteOnly   = items.some(i => i.id === 'e8_9') && !hasInvoice;

      if (!hasBaseline || !hasComparison) {
        outcomeType = 'nil'; awarded = 0;
        reasoning.push('Without evidence of the decoration at the commencement of the tenancy and a comparative record at its conclusion, the adjudicator cannot establish that any alteration was made by this tenant during the tenancy. This claim cannot be upheld.');
        gapsNoted.push('No baseline and/or comparative decoration evidence submitted. An unauthorised alteration claim must first establish the original condition and the altered condition through a before-and-after comparison.');
        legalPrinciple = 'missing_baseline';
      } else if (!hasProhibition) {
        outcomeType = 'nominal'; awarded = hasInvoice ? Math.round(claimed * 0.20 * 100) / 100 : 0;
        reasoning.push('The check-in and check-out evidence establish that the decoration was altered during the tenancy. However, to recover the cost of reinstatement the landlord must demonstrate that the alteration was carried out in breach of a specific term of the tenancy agreement.');
        reasoning.push('The tenancy agreement material submitted contains no express clause prohibiting alterations or requiring the tenant to obtain prior written consent before redecorating. A generic obligation to keep the property in good condition is not sufficient to establish that a decorative change was a breach. In the absence of an operative prohibition, the adjudicator cannot find that the tenant breached the agreement, and only a nominal award can be made.');
        gapsNoted.push('No express clause prohibiting alterations or requiring the landlord\'s written consent was submitted. Unauthorised alteration claims require a specific contractual prohibition — a general "good condition" clause will not suffice.');
        legalPrinciple = 'unauthorised_alteration';
      } else if (hasProhibition && hasComparison && hasInvoice && hasConsentTrail) {
        outcomeType = 'full'; awarded = claimed;
        reasoning.push('The tenancy agreement expressly prohibits alterations to the decoration without the landlord\'s prior written consent and requires reinstatement at the end of the tenancy. The check-in inventory and photographs establish the original finish, and the checkout report and photographs establish that the tenant applied a materially different finish to the wall in question.');
        reasoning.push('The correspondence confirms that consent was neither sought nor given. The adjudicator is satisfied that an unauthorised alteration was made in breach of the tenancy agreement and that the reinstatement cost is reasonable and supported by a professional invoice. The full amount is awarded.');
        legalPrinciple = 'unauthorised_alteration';
      } else {
        outcomeType = 'partial'; awarded = claimed;
        legalPrinciple = 'unauthorised_alteration';
        reasoning.push('The tenancy agreement prohibits alterations without written consent and the check-in and check-out evidence establish that the tenant altered the decoration. The adjudicator accepts that a reinstatement liability arises in principle.');
        if (!hasInvoice) {
          awarded = Math.round(claimed * (hasQuoteOnly ? 0.55 : 0.45) * 100) / 100;
          gapsNoted.push('No professional reinstatement invoice was submitted — only a quotation or estimate. A quotation does not establish that a cost was incurred, so quantum is not fully proven and the award is reduced accordingly.');
          legalPrinciple = 'financial_accuracy';
        }
        if (!hasConsentTrail) {
          awarded = Math.round(awarded * 0.85 * 100) / 100;
          gapsNoted.push('No correspondence evidencing that consent was withheld or never sought was submitted. A documented consent trail materially strengthens an unauthorised-alteration claim; its absence attracts a reduction.');
        }
        reasoning.push(`Taking these evidential limitations into account, the adjudicator awards £${awarded.toFixed(2)} of the £${claimed.toFixed(2)} claimed.`);
      }
    }

    else if (scenario.trap === 'no_double_recovery') {
      const hasCleaningOverlap   = items.some(i => i.id === 'e9_3');
      const hasSpecificPetClause = items.some(i => i.id === 'e9_7' && !i.flaw); // vague clause is flawed → false
      const hasInfestationProof  = items.some(i => (i.type === 'baseline' || i.type === 'comparative') && i.weight === 'strong' && /infestation|flea|contaminat/i.test(i.desc || ''));
      const hasTreatmentInvoice  = items.some(i => (i.id === 'e9_5' || i.id === 'e9_6') && !i.flaw); // quotes are flawed → false

      if (hasSpecificPetClause && hasInfestationProof && hasTreatmentInvoice && !hasCleaningOverlap) {
        // Full basis (not reachable with this scenario's pool, retained for engine consistency)
        outcomeType = 'partial'; awarded = Math.round(claimed * 0.7 * 100) / 100;
        reasoning.push('The tenancy agreement obliges the tenant to fund the specialist treatment, an independent report establishes that treatment was necessary, and an invoice for completed work has been produced. As no overlapping cleaning claim has been made, a substantial award can be considered.');
        legalPrinciple = 'contractual_basis';
      } else {
        outcomeType = 'nil'; awarded = 0;
        reasoning.push('The deposit is presumed to belong to the tenant. To sustain a deduction for specialist treatment, the landlord must first identify a term of the tenancy agreement obliging the tenant to fund it. The pet clause submitted permits the keeping of a cat and requires the property to be returned free of odour — an obligation discharged by ordinary cleaning. It creates no contractual basis for a separate paid specialist treatment.');
        legalPrinciple = 'contractual_basis';
        if (hasCleaningOverlap) {
          reasoning.push('The adjudicator further notes that a separate deduction for a full professional clean of the property — expressly including the carpets and soft furnishings — has already been claimed and evidenced by invoice. The remedial scope described in the specialist-treatment documentation substantially overlaps with the cleaning already claimed. An adjudicator will not permit the same remedial work to be recovered twice.');
          legalPrinciple = 'no_double_recovery';
          gapsNoted.push('The specialist treatment overlaps with the professional clean already claimed — this is double recovery, and the adjudicator will not award the same work twice.');
        }
        reasoning.push('In any event, quantum is not established: the sum claimed is supported only by quotations, no invoice for treatment actually carried out has been produced, and there is no independent evidence — such as a professional pest-control report — that any infestation or contamination existed. No award is made in respect of this claim.');
        gapsNoted.push('No contractual basis for a paid specialist treatment; quantum unproven (quotes only, no invoice); and no independent evidence that any infestation or contamination existed.');
      }
    }

    // Flawed item commentary
    const flawedItems = items.filter(i => i.flaw && i.flaw !== 'irrelevant' && i.flaw !== 'adverse');
    flawedItems.forEach(item => {
      if (item.flawNote) gapsNoted.push(`Regarding "${item.title}": ${item.flawNote}`);
    });

    // Irrelevant items penalty
    if (hasIrrelevant()) {
      gapsNoted.push('The adjudicator notes that the submission includes documents that have no bearing on the issues to be determined. Over-bundling with irrelevant material does not strengthen a case; it adds to the adjudicator\'s workload without contributing to the evidential picture and can suggest that the claimant has not carefully considered what is and is not relevant. The adjudicator has disregarded the irrelevant documents and assessed the claim on the basis of the relevant evidence only.');
    }

    // Acknowledge covering notes — read and referenced in the decision
    const itemsWithNotes = evidenceConsidered.filter(e => e.coveringNote && e.coveringNote.length > 0);
    if (itemsWithNotes.length > 0) {
      const noteRefs = itemsWithNotes.map(e => `"${e.coveringNote.length > 120 ? e.coveringNote.substring(0, 120) + '…' : e.coveringNote}" (submitted in respect of: ${e.title})`).join(' | ');
      reasoning.push(`The adjudicator has read and considered the covering submissions provided by the landlord/agent for ${itemsWithNotes.length} evidence item(s): ${noteRefs}. These submissions have been taken into account alongside the documents themselves and are reflected in the findings above.`);
    }

    return {
      deductionId: ded.id,
      category: ded.category,
      claimed,
      awarded: Math.min(awarded, claimed),
      outcomeType,
      reasoning,
      gapsNoted,
      legalPrinciple,
      evidenceConsidered,
      justification: ded.justification
    };
  },

  closingRemarks(results, totalAwarded, deposit) {
    const fullCount    = results.filter(r => r.outcomeType === 'full').length;
    const nilCount     = results.filter(r => r.outcomeType === 'nil').length;
    const partialCount = results.filter(r => r.outcomeType === 'partial').length;
    const nominalCount = results.filter(r => r.outcomeType === 'nominal').length;
    const totalClaimed = results.reduce((s,r) => s + r.claimed, 0);
    const ratio = totalClaimed > 0 ? totalAwarded / totalClaimed : 0;

    if (ratio >= 0.85) {
      return `The adjudicator is satisfied that this was a well-constructed and proportionate evidence submission. The documents presented were clearly relevant to the claims made, the baseline and comparative evidence established the necessary before-and-after comparison, and the financial evidence was supported by professional documentation from independent third parties. The adjudicator awards the amounts set out above. The deposit is to be released accordingly within 10 working days of the date of this decision.`;
    } else if (ratio >= 0.5) {
      return `The adjudicator has considered all evidence submitted. ${fullCount > 0 ? `${fullCount} deduction(s) were fully supported by the evidence. ` : ''}${partialCount > 0 ? `${partialCount} deduction(s) received partial awards, reflecting the application of legal principles or evidential limitations. ` : ''}${nilCount + nominalCount > 0 ? `${nilCount + nominalCount} deduction(s) were not upheld or received only nominal awards due to the absence of sufficient supporting evidence. ` : ''}The adjudicator notes that the overall quality of the bundle would benefit from closer attention to baseline documentation, independent professional evidence, and the pre-submission acknowledgement of principles such as betterment and fair wear and tear. The deposit is to be released in accordance with the award set out above.`;
    } else {
      return `The adjudicator has found that the evidence submitted in support of this claim fell substantially below the standard required to establish the deductions on the balance of probabilities. ${nilCount > 0 ? `${nilCount} deduction(s) received nil awards due to the absence of essential evidence. ` : ''}The adjudicator reminds the landlord that the burden of proof rests with the claimant, and that the deposit is presumed to belong to the tenant unless the landlord demonstrates otherwise. Without a professional check-in inventory with photographs, independent contractor invoices, and evidence of a clear before-and-after comparison, it is not possible to establish the necessary evidential foundation for the claims made. The deposit is to be released to the tenant in accordance with the award set out above.`;
    }
  },

  generateRef(scenarioId) {
    const prefix = 'TDS';
    const year   = new Date().getFullYear();
    const num    = String(Math.floor(Math.random() * 90000) + 10000);
    return `${prefix}/${year}/${scenarioId}${num}`;
  },

  legalPrincipleText(principle) {
    const map = {
      missing_baseline: `Missing Baseline Evidence — The deposit is presumed to belong to the tenant unless the landlord establishes otherwise. Without a check-in inventory or comparable documentation establishing the condition of the property at the commencement of the tenancy, the adjudicator is unable to determine whether any deterioration documented at check-out pre-existed the tenancy or occurred during it. TDS guidance is explicit: "Without an inventory, it is very difficult, if not impossible, to prove what condition the property was in at the start of the tenancy." A professional check-in inventory produced by an AIIC-registered or similarly accredited independent clerk, accompanied by a dated photographic schedule, is considered best practice by all three authorised schemes.`,

      betterment: `Betterment Principle — A landlord is not entitled to be placed in a better financial position as a result of a deposit claim than they were at the start of the tenancy. Where an item is damaged or destroyed and must be replaced, the adjudicator will apply an age-related reduction to reflect the remaining useful life of the item at the time of the tenant's departure, rather than awarding the full cost of a brand-new replacement. TDS and NRLA jointly publish a product lifespan guide that adjudicators use as a reference point. Standard lifespans include: carpets (medium quality) 5–8 years; interior decoration 5–7 years; washing machines 10–12 years; ovens 10–12 years; sofas (medium) 7–10 years. If a carpet was already 6 years old at the start of a 2-year tenancy, and its lifecycle is 10 years, only 2 remaining years out of 10 (20%) of the replacement cost is claimable. Claiming full replacement cost for aged items without betterment acknowledgement is one of the most common reasons landlord claims are substantially reduced.`,

      decoration_lifecycle: `Decoration Lifecycle Principle — Interior decoration has a recognised useful life, typically 5–7 years in a residential rental property (TDS/NRLA joint guidance). A tenant is not obliged to redecorate simply because they have occupied the property for several years, as some degree of deterioration over time is attributable to fair wear and tear rather than damage. The adjudicator will calculate the proportion of the decoration lifecycle remaining at the end of the tenancy and award only that proportion of the redecoration cost. Example: if the property was freshly decorated at the start of a 4-year tenancy against a 6-year lifecycle, only 2 years of usable decoration life remain (33%), and the maximum claimable proportion of redecoration costs is 33%. Claims for full redecoration costs after tenancies of 4 or more years will almost always receive a reduced award reflecting this principle, even where damage exceeds normal wear and tear.`,

      evidential_weight: `Evidential Weight — The adjudicator assesses the weight to be given to each document based on its reliability, independence, and completeness. Documents prepared by the landlord or agent themselves (self-prepared inventories, cost estimates, condition reports) are assessed with greater scrutiny than independently-produced documents, as they are not impartial. Key factors that reduce evidential weight include: unsigned documents (particularly check-in inventories where the tenant's agreement is not recorded); undated photographs (the date stamp is critical to confirm when photographs were taken); photographs taken by interested parties without independent verification; single supplier quotes without comparison; and photocopies or screenshots without originals. TDS states: "An inventory, once signed and agreed between the parties, is the cornerstone of any deposit dispute. Without a signed inventory, claims for damage and cleaning become significantly harder to substantiate."`,

      contractual_basis: `Contractual Basis — The adjudicator can only make an award where the landlord demonstrates a breach of the tenancy agreement. Each deduction must be grounded in a specific contractual obligation owed by the tenant. If the tenancy agreement contains no clause addressing the matter in dispute, or if the relevant clause is too vague to establish a precise obligation, the adjudicator will not infer obligations that were not clearly agreed. Cleaning clauses that require professional cleaning at the end of every tenancy regardless of check-in condition are unenforceable under the Tenant Fees Act 2019. Garden clauses that say only "maintain in reasonable condition" are insufficient to enforce specific maintenance obligations — a strong clause will name the obligations explicitly (mowing frequency, weed control, hedge cutting schedule). The submission of a specific, relevant tenancy agreement clause is essential supporting evidence for any deduction.`,

      correspondence_trail: `Correspondence Trail for Arrears — A sustained, documented trail of formal written demands is a key element of a well-evidenced rent arrears claim. The adjudicator will consider whether the landlord made reasonable efforts to notify the tenant of the outstanding sums and to pursue recovery before raising the dispute. A single informal message or text is insufficient. Best practice is: a first written demand by email within 3 days of the missed payment, a second formal demand after 7 days, and a third notice stating that formal dispute proceedings will follow. All demands should be sent to the tenant's confirmed email address and retained in the evidence bundle with the dates clearly visible. Where only one demand can be evidenced, and no tenant acknowledgement is on record, the adjudicator will note the absence of a sustained demand process and may reduce the award accordingly, even where the arrears are otherwise proven by bank statement evidence.`,

      financial_accuracy: `Financial Accuracy — All financial evidence must be internally consistent, fully reconciled, and capable of independent verification. A rent schedule or ledger submitted in support of an arrears claim will be compared against supporting bank statement evidence by the adjudicator. Any unexplained gap or discrepancy in the schedule — such as a missing month, an unaccounted payment, or an inconsistency between the schedule and bank records — will be identified and may result in a reduced award or the rejection of the claim entirely. The adjudicator cannot be expected to resolve discrepancies in the landlord's own records. Where a tenant submits evidence of a payment that the landlord's schedule does not show, the landlord must have reconciled this before submission. Bank statements covering the full tenancy period are the primary corroborating document for any arrears claim. Where a cost is claimed, an invoice for work actually carried out is stronger than a quotation: a quote demonstrates only a potential price, not that any expenditure was incurred.`,

      unauthorised_alteration: `Unauthorised Alterations — Where a landlord seeks the cost of reinstating the property following an alteration made by the tenant (for example, repainting in a non-standard colour, removing fixtures, or fitting shelving), three elements must each be established. First, that the alteration was in fact made during this tenancy — proven by comparing the check-in and check-out records. Second, that it was unauthorised — the tenancy agreement must contain an express term prohibiting alterations, or requiring the landlord's prior written consent, and the landlord should be able to show that consent was neither sought nor given. A generic obligation to keep the property "in good condition" is not sufficient to establish that a decorative change was a breach. Third, that the reinstatement cost claimed is reasonable and supported by an invoice or comparable quotations. Where the decoration being reinstated was not freshly applied at the start of the tenancy, an age-related reduction reflecting the decoration lifecycle may also apply, as it would in an ordinary redecoration claim.`,

      no_double_recovery: `No Double Recovery — A landlord may recover the cost of remedying a particular loss once only, and may not be placed in a better position than performance of the tenancy would have produced. Where the same remedial work is captured within more than one deduction — for example, a general professional cleaning invoice that already covers the carpets and soft furnishings, alongside a separate "specialist treatment" charge for those same areas — the adjudicator will award the work once and disregard the duplicate. Each distinct deduction must additionally rest on its own contractual obligation and its own proven quantum: a charge that duplicates work already claimed, that has no basis in a specific term of the tenancy agreement, and that is supported only by a quotation rather than an invoice for work actually carried out, will not be awarded. The disciplined course is to identify overlap and unsupported charges before submission and to claim only what is distinct, contractually grounded, and evidenced.`,
    };
    return map[principle] || null;
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   UI HELPERS
═══════════════════════════════════════════════════════════════════════════ */
const UI = {
  root: null,
  modal: null,

  init() {
    this.root  = document.getElementById('screen-root');
    this.modal = document.getElementById('modal-backdrop');
    document.getElementById('btn-back').addEventListener('click', () => NAV.back());
    document.getElementById('btn-next').addEventListener('click', () => NAV.next());
    document.getElementById('modal-ok').addEventListener('click', () => this.closeModal());
    document.getElementById('modal-cancel').addEventListener('click', () => this.closeModal());
  },

  render(html, keepScroll = false) {
    const sy = window.scrollY;
    this.root.innerHTML = html;
    if (keepScroll) { window.scrollTo(0, sy); } else { this.root.scrollTop = 0; window.scrollTo(0, 0); }
  },

  showModal(title, body, { showCancel = false, onOk = null } = {}) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').textContent  = body;
    const cancel = document.getElementById('modal-cancel');
    const ok     = document.getElementById('modal-ok');
    cancel.classList.toggle('hidden', !showCancel);
    this.modal.classList.remove('hidden');
    this._modalOnOk = onOk;
    ok.onclick = () => { this.closeModal(); if (onOk) onOk(); };
  },

  closeModal() { this.modal.classList.add('hidden'); },

  setFooter(show, { backLabel = 'Back', nextLabel = 'Continue', hint = '', status = '', nextDisabled = false } = {}) {
    const footer = document.getElementById('nav-footer');
    footer.classList.toggle('hidden', !show);
    document.getElementById('btn-back').querySelector('svg + *') || null;
    document.getElementById('btn-back').childNodes[1] && (document.getElementById('btn-back').childNodes[1].textContent = ' ' + backLabel);
    document.getElementById('btn-next').childNodes[0] && (document.getElementById('btn-next').childNodes[0].textContent = nextLabel + ' ');
    document.getElementById('nav-footer-hint').textContent   = hint;
    document.getElementById('nav-footer-status').textContent = status;
    document.getElementById('btn-next').disabled = nextDisabled;
  },

  wizardHtml(activeScreen) {
    const steps = [
      { n:1, label:'Scenarios' }, { n:2, label:'Case Brief' }, { n:3, label:'Deductions' },
      { n:4, label:'Evidence' },  { n:5, label:'Review' },     { n:6, label:'Decision' },
      { n:7, label:'Debrief' }
    ];
    let html = '<nav class="wizard-nav" aria-label="Progress">';
    steps.forEach((s, i) => {
      const state = s.n < activeScreen ? 'done' : s.n === activeScreen ? 'active' : 'pending';
      html += `<div class="wizard-step">
        <div class="wizard-step-inner">
          <div class="wizard-dot ${state}">${state === 'done' ? ICONS.check : s.n}</div>
          <span class="wizard-label ${state}">${s.label}</span>
        </div>
      </div>`;
      if (i < steps.length - 1) html += `<div class="wizard-connector ${s.n < activeScreen ? 'done' : ''}"></div>`;
    });
    html += '</nav>';
    return html;
  },

  escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  },

  formatGBP(n) { return '£' + (parseFloat(n) || 0).toFixed(2); },

  awardChip(type, amount) {
    const labels = { full:'Full Award', partial:'Partial Award', nominal:'Nominal Award', nil:'Nil Award' };
    return `<span class="award-chip award-${type}">${labels[type] || type}${amount !== undefined ? ' — ' + UI.formatGBP(amount) : ''}</span>`;
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   SCREEN 3 — SCHEDULE OF DEDUCTIONS

function renderScreen3() {

      <div class="deduction-row" id="ded-row-${UI.escHtml(ded.id)}">
        <div class="deduction-row-header">
          <span class="t-strong t-small">Deduction ${idx+1}</span>

                value="${UI.escHtml(ded.amount)}"
                oninput="updateDeduction('${UI.escHtml(ded.id)}','amount',this.value);updateDepositSummary()"
                aria-describedby="amt-err-${UI.escHtml(ded.id)}">

    </button>` : `<p class="t-small t-muted mb-3">Maximum of ${GOVERNANCE.CAPS.maxDeductions} deductions reached.</p>`}

      <div class="deposit-summary-item">
        <div class="label">Total Deposit</div>

      </div>
      <div class="deposit-summary-item">
        <div class="label">Total Claimed</div>
        <div class="value" id="summary-claimed">${UI.formatGBP(STATE.totalClaimed())}</div>
      </div>
      <div class="deposit-summary-item">
        <div class="label">Returnable to Tenant</div>
        <div class="value${STATE.totalClaimed() > s.deposit ? ' over' : ''}" id="summary-returnable">
          ${UI.formatGBP(Math.max(0, s.deposit - STATE.totalClaimed()))}

      </div>

    ${STATE.totalClaimed() > s.deposit ? `
    <div class="alert alert-warning" style="margin-top:1rem">

    nextDisabled: false
  });
}

function addDeduction() {
  if (STATE.deductions.length >= GOVERNANCE.CAPS.maxDeductions) return;
  STATE.addDeduction();
  renderScreen3();
}

function removeDeduction(id) {
  STATE.removeDeduction(id);
  renderScreen3();
}

function updateDeduction(id, field, value) {
  const ded = STATE.deductions.find(d => d.id === id);
  if (!ded) return;
  ded[field] = GOVERNANCE.sanitiseText(value);
}

function updateCharCount(ccId, value, max) {
  const el = document.getElementById(ccId);
  if (!el) return;
  el.textContent = `${value.length}/${max}`;
  el.classList.toggle('warn', value.length > max * 0.9);
}

function updateDepositSummary() {
  const s = STATE.scenario();
  const claimed = STATE.totalClaimed();
  const returnable = Math.max(0, s.deposit - claimed);
  const claimedEl    = document.getElementById('summary-claimed');
  const returnableEl = document.getElementById('summary-returnable');
  if (claimedEl)    claimedEl.textContent = UI.formatGBP(claimed);
  if (returnableEl) { returnableEl.textContent = UI.formatGBP(returnable); returnableEl.classList.toggle('over', claimed > s.deposit); }
}

function validateScreen3() {
  const s = STATE.scenario();
  let valid = true;
  STATE.deductions.forEach(ded => {
    const catEl  = document.getElementById(`cat-${ded.id}`);
    const amtEl  = document.getElementById(`amt-${ded.id}`);
    const justEl = document.getElementById(`just-${ded.id}`);
    const amtErrEl  = document.getElementById(`amt-err-${ded.id}`);
    const justErrEl = document.getElementById(`just-err-${ded.id}`);

    if (!ded.category) { valid = false; if (catEl) catEl.style.borderColor = 'var(--red)'; }
    const amtErr = GOVERNANCE.validateAmount(ded.amount, s.deposit);
    if (amtErr) { valid = false; if (amtErrEl) { amtErrEl.textContent = amtErr; amtErrEl.classList.remove('hidden'); } }
    else { if (amtErrEl) amtErrEl.classList.add('hidden'); }
    const justErr = GOVERNANCE.validateText(ded.justification, 'Justification', 20, 500);
    if (justErr) { valid = false; if (justErrEl) { justErrEl.textContent = justErr; justErrEl.classList.remove('hidden'); } }
    else { if (justErrEl) justErrEl.classList.add('hidden'); }
  });
  if (STATE.totalClaimed() > s.deposit) valid = false;
  return valid;
}

function toggleEvidence(dedId, itemId) {
  const sels = STATE.evidenceSelections[dedId] || [];
  const existing = sels.findIndex(e => e.evidenceId === itemId);
  if (existing >= 0) {
    sels.splice(existing, 1);
  } else {
    if (sels.length >= GOVERNANCE.CAPS.maxEvidencePerDeduction) {
      UI.showModal('Evidence Limit Reached', `You may select a maximum of ${GOVERNANCE.CAPS.maxEvidencePerDeduction} evidence items per deduction. Remove an item before adding another.`);
      return;
    }
    sels.push({ evidenceId: itemId, coveringNote: '' });
  }
  STATE.evidenceSelections[dedId] = sels;
  renderScreen4(true);
}

function updateCoveringNote(dedId, itemId, value) {
  const sels = STATE.evidenceSelections[dedId] || [];
  const sel = sels.find(e => e.evidenceId === itemId);
  if (sel) sel.coveringNote = GOVERNANCE.sanitiseText(value).substring(0, GOVERNANCE.CAPS.maxCoveringNoteLen);
}

/* ═══════════════════════════════════════════════════════════════════════════
   SCREEN 5 — BUNDLE REVIEW & SUBMISSION
═══════════════════════════════════════════════════════════════════════════ */
function renderScreen5() {
  const s = STATE.scenario();
  let warnings = [];
  let dedReviews = '';

  STATE.deductions.forEach((ded, idx) => {
    const sels = STATE.evidenceSelections[ded.id] || [];
    const selectedIds = sels.map(e => e.evidenceId);
    const selectedItems = s.evidencePool.filter(i => selectedIds.includes(i.id));
    const catLabel = ded.category ? ded.category.replace('_',' ').replace(/\b\w/g,c=>c.toUpperCase()) : 'Unnamed';

    const hasBaseline    = selectedItems.some(i => i.type === 'baseline' && i.flaw !== 'irrelevant');
    const hasComparative = selectedItems.some(i => i.type === 'comparative' && i.flaw !== 'irrelevant');
    const hasFinancial   = selectedItems.some(i => i.type === 'financial' && i.flaw !== 'irrelevant');
    const hasIrrelevant  = selectedItems.some(i => i.flaw === 'irrelevant');
    const hasFlawed      = selectedItems.some(i => i.flaw && i.flaw !== 'irrelevant' && i.flaw !== 'adverse');
    const hasAdverse     = selectedItems.some(i => i.flaw === 'adverse');

    if (!hasBaseline)    warnings.push(`Deduction ${idx+1} (${catLabel}): No check-in baseline evidence included.`);
    if (!hasComparative) warnings.push(`Deduction ${idx+1} (${catLabel}): No checkout or comparative evidence included.`);
    if (!hasFinancial)   warnings.push(`Deduction ${idx+1} (${catLabel}): No financial evidence (invoice or quote) included.`);
    if (hasIrrelevant)   warnings.push(`Deduction ${idx+1} (${catLabel}): Potentially irrelevant items included — review your selection.`);
    if (hasFlawed)       warnings.push(`Deduction ${idx+1} (${catLabel}): One or more items with known documentation flaws are included.`);
    if (hasAdverse)      warnings.push(`Deduction ${idx+1} (${catLabel}): An adverse document is included that may support the tenant's position.`);
    if (sels.length === 0) warnings.push(`Deduction ${idx+1} (${catLabel}): No evidence selected — this will almost certainly result in a nil award.`);

    const evList = selectedItems.length > 0
      ? selectedItems.map(item => {
          const wClass = item.weight === 'strong' ? 'tag-strong' : item.weight === 'moderate' ? 'tag-moderate' : 'tag-weak';
          return `<div class="review-evidence-item">${ICONS.doc}<span style="flex:1">${UI.escHtml(item.title)}</span>
            <span class="evidence-tag ${wClass}" style="font-size:0.7rem">${item.weight}</span>
            ${item.flaw && item.flaw !== 'irrelevant' ? `<span class="evidence-tag tag-flawed" style="font-size:0.7rem">${ICONS.warn}</span>` : ''}</div>`;
        }).join('')
      : `<p class="t-small t-muted" style="padding:0.5rem 0">No evidence selected.</p>`;

    dedReviews += `<div class="review-deduction-item">
      <div class="review-deduction-header">
        <div><span class="t-strong">Deduction ${idx+1}: ${UI.escHtml(catLabel)}</span>
          <span class="t-small t-muted" style="margin-left:0.75rem">${UI.formatGBP(ded.amount)}</span></div>
        <span class="badge badge-navy">${sels.length} evidence item${sels.length!==1?'s':''}</span>
      </div>
      <div class="review-evidence-list">
        <p class="t-small" style="margin-bottom:0.625rem;color:var(--text-secondary)"><strong>Justification:</strong> ${UI.escHtml(ded.justification)}</p>
        ${evList}
      </div></div>`;
  });

  const warningHtml = warnings.length > 0
    ? warnings.map(w => `<div class="warning-flag">${ICONS.warn}<span>${UI.escHtml(w)}</span></div>`).join('')
    : `<div class="alert alert-success">${ICONS.check}<div>No critical gaps detected. Proceed to submit for adjudication.</div></div>`;

  UI.render(`
    ${UI.wizardHtml(5)}
    <div class="page-header">
      <div class="eyebrow">Screen 5 of 7 — Bundle Review</div>
      <h1>Review Your Submission</h1>
      <p>Read-only summary of your full submission. Review warning flags before submitting — you may go back to correct issues.</p>
    </div>
    <div class="card mb-3">
      <div class="card-header"><span class="t-h3">Submission Warnings</span></div>
      <div class="card-body">${warningHtml}</div>
    </div>
    <div class="card mb-3">
      <div class="card-header">
        <span class="t-h3">Deductions &amp; Evidence Summary</span>
        <span class="badge badge-navy">${UI.formatGBP(STATE.totalClaimed())} total claimed</span>
      </div>
      <div class="card-body" style="padding-top:0.5rem">${dedReviews}</div>
    </div>
    <div class="deposit-summary">
      <div class="deposit-summary-item"><div class="label">Deposit Held</div><div class="value">${UI.formatGBP(s.deposit)}</div></div>
      <div class="deposit-summary-item"><div class="label">Total Claimed</div><div class="value">${UI.formatGBP(STATE.totalClaimed())}</div></div>
      <div class="deposit-summary-item"><div class="label">Minimum Returnable</div><div class="value">${UI.formatGBP(Math.max(0,s.deposit-STATE.totalClaimed()))}</div></div>
    </div>`);

  UI.setFooter(true, { backLabel:'Evidence', nextLabel:'Submit for Adjudication',
    hint: warnings.length > 0 ? `${warnings.length} warning(s) — review before submitting` : 'Ready to submit',
    status: `${STATE.deductions.length} deduction(s)` });
}

/* ═══════════════════════════════════════════════════════════════════════════

          <p style="font-size:0.75rem;color:var(--text-muted);margin-top:0.5rem">Ref: ${UI.escHtml(result.caseRef)} | Issued: ${fmt(decisionDate)} | Training simulation only — not affiliated with TDS, DPS or mydeposits</p>
          <button class="btn btn-secondary btn-sm" onclick="window.print()" style="margin-top:0.875rem">${ICONS.print} Print / Save as PDF</button>
        </div>

      </div>
    </div>`);

  UI.setFooter(true, { backLabel:'Review Bundle', nextLabel:'View Debrief & Learning',
